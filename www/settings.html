<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>СКЭ-02 Настройки</title>
  <style>
    /* ==================================================================
     * STYLE MAP (settings.html - страница настроек параметров прибора)
     *   1. общие: body, header, .tag/.ok/.bad, button, input/select
     *   2. навигация меню: #nav (разделы L1), .tabs (табы L2),
     *      .subtabs (подтабы L3)
     *   3. таблица параметров: table/td/th, .val, .ctl, .where
     *   4. редакторы значений: .set (обёртка поля), .t2 (TIME/DATE),
     *      .dv (разделитель : . .)
     *   5. панель действий: #actions (пароль/Применить/Обновить),
     *      #filter (фильтр поиска), #secPw, tr.dirty, button.run
     *   6. F|V-грид линеаризации: .lingrid
     * ================================================================== */

    /* --- 1. общие ---------------------------------------------------- */
    body {
      font: 13px/1.45 system-ui, sans-serif;
      background: #000000;
      color: #d8dee9;
      margin: 0;
      padding: 4px
    }

    /* шапка: заголовок, метки связи, кнопки навигации */
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px
    }

    /* заголовок "SKE-02 Настройки" */
    h1 {
      font-size: 18px;
      margin: 0 8px 0 0
    }

    /* метка-пилюля в шапке (UART: связь, fw) */
    .tag {
      background: #2a3140;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 12px;
      white-space: nowrap
    }

    /* метка связи: зелёный (связь есть) */
    .ok {
      background: #1d5c2f
    }

    /* метка связи: красный (нет связи) */
    .bad {
      background: #6c2431
    }

    /* все обычные кнопки */
    button {
      background: #2a5bdb;
      color: #fff;
      border: 0;
      border-radius: 4px;
      padding: 5px 5px;
      cursor: pointer;
      font-size: 12px
    }

    /* поля ввода и комбобоксы (редакторы параметров) */
    input,
    select {
      background: #0e1116;
      color: #d8dee9;
      border: 1px solid #39414f;
      border-radius: 4px;
      padding: 4px 4px;
      box-sizing: border-box
    }

    /* поле фильтра по имени/id в панели действий */
    #filter {
      width: 200px
    }

    /* --- 2. навигация меню ----------------------------------------- */

    /* ряд кнопок разделов первого уровня (Измеритель/Основные/...) */
    #nav {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px
    }

    #nav button {
      background: #2a3140;
      font-size: 12px;
      padding: 8px 8px
    }

    #nav button.act {
      background: #2a5bdb
    }

    /* ряд табов второго уровня внутри раздела */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      border-bottom: 2px solid #2a3140;
      margin-bottom: 8px
    }

    .tabs button {
      background: transparent;
      color: #8b94a7;
      border: 0;
      border-bottom: 2px solid transparent;
      border-radius: 6px 6px 0 0;
      padding: 7px 14px;
      cursor: pointer;
      font-size: 12px
    }

    .tabs button.act {
      color: #d8dee9;
      background: #1b202a;
      border-bottom-color: #2a5bdb
    }

    /* ряд подтабов третьего уровня */
    .subtabs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin: 0 0 8px 8px
    }

    .subtabs button {
      background: #232a38;
      color: #8b94a7;
      border: 0;
      border-radius: 10px;
      padding: 3px 5px;
      cursor: pointer;
      font-size: 12px
    }

    .subtabs button.act {
      background: #1d5c2f;
      color: #d8dee9
    }

    /* --- 3. таблица параметров -------------------------------------- */

    /* таблица "Параметр | редактор" текущего таба */
    table {
      width: 100%;
      border-collapse: collapse
    }

    td,
    th {
      padding: 5px 5px;
      border-top: 1px solid #2a3140;
      text-align: left;
      vertical-align: middle
    }

    th {
      color: #8b94a7;
      font-weight: 500;
      font-size: 12px
    }

    /*отображение значение параметра (моноширинный текст) */
    .val {
      font-family: ui-monospace, Consolas, monospace;
      white-space: nowrap
    }

    /* давнее значение (обновлялось давно) - тусклее */
    .stale {
      color: #8b94a7
    }

    /* колонка редактора - прижата вправо */
    .ctl {
      text-align: right;
      vertical-align: middle
    }

    /* подпись-путь меню под именем параметра (в поиске) */
    .where {
      color: #8b94a7;
      font-size: 12px;
      margin-top: 1px
    }

    /* --- 4. редакторы значений -------------------------------------- */

    /* обёртка поля редактора (комбобокс/число/пароль) в ячейке */
    .set {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end
    }

    .set input[type=number],
    .set input[type=text] {
      width: 80px
    }

    .set input.fnum {
      width: 80px
    }

    .set select {
      max-width: 100px
    }

    /* половинки TIME (чч:мм) и DATE (дд.мм.гг) */
    .t2 {
      width: 56px !important;
      text-align: center
    }

    /* разделители : и . в TIME/DATE */
    .dv {
      color: #8b94a7
    }

    /* --- 5. панель действий ----------------------------------------- */

    /* строка: пароль меню, Применить, Обновить, сообщение */
    #actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin: 0 0 8px 0
    }

    /* поле пароля текущего раздела */
    #secPw {
      width: 140px
    }

    /* зелёная кнопка "Выполнить" у пунктов CMD */
    button.run {
      background: #1d5c2f
    }

    /* фон строки с несохранённой правкой */
    tr.dirty td {
      background: #2a2517
    }

    /* служебное сообщение панели ("применено: N") */
    .flash {
      color: #7aa2f7
    }

    /* --- 6. F|V-грид линеаризации ----------------------------------- */

    /* сетка пар калибровки: поле ПРИЖАТО к своей метке (F01[поле] V01[поле]),
     * зазор между парами - побольше */
    .lingrid {
      display: grid;
      grid-template-columns: auto minmax(70px, 1fr) auto minmax(70px, 1fr);
      gap: 6px 6px;               /* поле прижато к метке */
      align-items: center;
      background: #1b202a;
      border: 1px solid #2a3140;
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 8px
    }

    /* зазор МЕЖДУ парами: отступ меток V-колонки (каждый 3-й элемент) */
    .lingrid > :nth-child(4n + 3) {
      margin-left: 16px
    }

    /* подписи F01/V01 в сетке линеаризации */
    .lingrid label {
      color: #8b94a7;
      font-size: 12px;
      white-space: nowrap
    }

    /* поля грида - вплотную к метке, узкие */
    .lingrid .set {
      justify-content: flex-start;
      gap: 2px
    }

    .lingrid .set input {
      width: 76px;
      padding: 2px 4px
    }

    /* изменённое поле линеаризации - жёлтая рамка */
    .lingrid input.dirty {
      border-color: #e3b341
    }
  </style>
</head>

<body>
  <header>
    <h1>SKE-02 Прибор</h1>
    <!-- меток UART/fw и кнопки Wi-Fi здесь больше нет: всё это на /panel -->
    <a href="#panel" style="margin-left:auto"><button>&#8592; Назад</button></a>
  </header>
  <div id="nav"></div>
  <div id="tabs"></div>
  <div id="subtabs"></div>
  <div id="actions">
    <input id="secPw" type="password" inputmode="numeric" maxlength="6" placeholder="пароль меню" oninput="pwInput()">
    <button id="btnApply" onclick="applyAll()">Применить</button>
    <button id="btnRefresh" onclick="refreshAll()">Обновить</button>
    <span id="applyMsg" class="flash"></span>
  </div>
  <div id="bar">
    <input id="filter" placeholder="фильтр по имени или id" oninput="applyFilter()">
  </div>
  <div id="sections">
    <p>Опрос прибора…</p>
  </div>
  <script src="/settings.js"></script>
</body>

</html>
