<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SKE-02 Gateway</title>
  <style>
    /* ==================================================================
     * STYLE MAP (index.html - главная страница мониторинга)
     *   1. общие: body, header, h1, .tag/.ok/.bad, button, #debug
     *   2. сетка виджетов: #values, .vcard (+ .wbar/.wbit/.chart/.wide),
     *      .vname (подпись), .vval (число)
     *   3. режим правки раскладки: body.edit*, #btnEdit.act
     *   4. панель "Виджеты": #wpanel*, #btnW.act, .flash
     *   5. виджет БАРГРАФ (.vcard.wbar): .hbar (дорожка), .hfill
     *      (рваная заливка), .bpct (проценты)
     *   6. виджет БИТ (.vcard.wbit): .bitlamp (лампа)
     * ================================================================== */

    /* --- 1. общие ---------------------------------------------------- */

    body {
      font: 13px/1.45 system-ui, sans-serif;
      /* background: #14171c; */
      background: #000000;       /* цвет фона всей страницы */
      color: #d8dee9;             /* основной цвет текста */
      margin: 0;
      padding: 12px               /* внешний отступ страницы */
    }

    /* шапка: заголовок, метки связи, кнопки (Раскладка/Виджеты/...) */
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px
    }

    h1 {
      font-size: 18px;            /* размер заголовка "SKE-02 Gateway" */
      margin: 0 8px 0 0
    }

    /* маленькая метка-пилюля в шапке (UART: связь, fw, ip...) */
    .tag {
      background: #2a3140;        /* фон метки */
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 12px;
      white-space: nowrap
    }

    .ok { background: #1d5c2f }   /* метка связи: зелёный (связь есть) */
    .bad { background: #6c2431 }  /* метка связи: красный (нет связи) */

    /* все обычные кнопки */
    button {
      background: #2a5bdb;        /* синий фон кнопки */
      color: #fff;
      border: 0;
      border-radius: 4px;
      padding: 5px 5px;           /* паддинг кнопки (верт гориз) */
      cursor: pointer;
      font-size: 12px
    }

    button.warn { background: #a23b2e } /* красная кнопка (Перезагрузить, удалить) */

    /* отладочная панель внизу (ip/rssi/uptime/heap) */
    #debug {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin: 0 0 8px 0;
      padding: 4px 8px;
      border: 1px dashed #39414f;
      border-radius: 4px;
      color: #8b94a7;
      font-size: 12px
    }

    #debug .tag {
      background: transparent;
      border: 1px solid #2a3140;
      padding: 1px 6px
    }

    #debug button {
      font-size: 12px;
      padding: 4px 4px
    }

    /* --- 2. сетка виджетов ------------------------------------------- */

    /* контейнер всех карточек-виджетов (#values в body) */
    #values {
      display: grid;
      /* half-width tracks: a normal card spans 2 tracks (a full cell,
       * 10 chars of 15px monospace), a bit card spans 1 -> two bits
       * pack into one value-card slot */
      grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
      gap: 6px;                   /* расстояние между карточками */
      margin: 0 0 10px 0
    }

    /* обычная карточка и карточка барграфа занимают полный слот */
    .vcard,
    .vcard.wbar {
      grid-column: span 2
    }

    /* карточка виджета общего вида (значение, расход, объём...) */
    .vcard {
      background: #1b202a;        /* фон карточки */
      border: 2px solid #2a3140;  /* рамка карточки */
      border-radius: 4px;
      padding: 2px 4px   /* vertical horizontal */
    }

    /* подпись (имя параметра) внутри карточки */
    .vname {
      color: #8b94a7;             /* серый цвет подписи */
      font-size: 11px             /* размер шрифта подписи */
    }

    /* числовое значение внутри карточки */
    .vval {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 16px;            /* размер цифр значения */
      white-space: nowrap
    }

    .vcard.wide { grid-column: span 4 }   /* широкая карточка (2 слота) */

    /* карточка графика расхода - на всю ширину строки */
    .vcard.chart {
      grid-column: 1/-1
    }

    /* canvas самого графика внутри карточки */
    .vcard.chart canvas {
      width: 100%;
      height: 120px;              /* высота графика */
      display: block
    }

    /* --- 3. режим правки раскладки ("✎ Раскладка" включает body.edit) - */

    #btnEdit.act { background: #1d5c2f }  /* кнопка Раскладка в активном режиме */

    body.edit .vcard {
      outline: 1px dashed #39414f; /* перетаскиваемая карточка: пунктир */
      cursor: grab
    }

    body.edit .vcard.dragging {   /* карточка в момент перетаскивания */
      opacity: .35;
      cursor: grabbing
    }

    body.edit #values { user-select: none }  /* не выделять текст при драге */

    /* --- 4. панель "Виджеты" ----------------------------------------- */

    #btnW.act { background: #1d5c2f }  /* кнопка Виджеты в активном режиме */

    /* панель конфигурации виджетов (список + кнопка Сохранить) */
    #wpanel {
      background: #1b202a;        /* фон панели */
      border: 1px solid #2a3140;
      border-radius: 4px;
      padding: 10px 12px;
      margin: 0 0 10px 0;
      display: flex;
      flex-direction: column;
      gap: 6px                    /* расстояние между строками панели */
    }

    #wpanel[hidden] { display: none }  /* выключенный атрибут hidden сильнее display:flex */

    /* строка панели: чекбокс+имя виджета, комбобоксы, кнопки */
    #wpanel .wrow {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      font-size: 13px
    }

    /* поля min/max в строке виджета */
    #wpanel input[type=number] {
      width: 80px
    }

    /* служебные сообщения панели ("не сохранено") */
    .flash {
      color: #7aa2f7;
      font-size: 12px
    }

    /* --- 5. виджет БАРГРАФ (t:'bar', .vcard.wbar) --------------------- */

    /* дорожка барграфа: тёмный фон, заливка едет внутри */
    .hbar {
      background: #0e1116;        /* цвет пустой дорожки */
      border: 1px solid #39414f;
      border-radius: 2px;
      height: 14px;               /* высота дорожки (в карточке ниже - 16) */
      margin-top: 6px;
      overflow: hidden
    }

    /* torn stripe fill: solid dashes with gaps */
    .hfill {
      height: 100%;
      width: 0;
      transition: width .25s ease-out;   /* плавность движения заливки */
      /* green torn stripe: wide dashes, hairline gaps */
      background: repeating-linear-gradient(90deg, #3fbf5f 0 10px, transparent 10px 11px) /* цвет штриха */
    }

    /* bar card: label + the stripe, 3px horizontal padding */
    .vcard.wbar {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 3px
    }

    /* дорожка внутри карточки барграфа - чуть выше */
    .vcard.wbar .hbar {
      height: 16px;
      margin-top: 0
    }

    /* percent readout, right-aligned in the bar label line */
    .bpct {
      float: right;
      color: #8b94a7;
      font-size: 12px;
      font-family: ui-monospace, Consolas, monospace
    }

    /* --- 6. виджет БИТ (t:'bit', .vcard.wbit) ------------------------- */

    /* bit-state card: HALF a value-cell wide (span 1 of the 2-track
     * cell) and compact, so two of them pack into one slot; the label
     * wraps on spaces, the lamp takes the chosen active color */
    .vcard.wbit {
      grid-column: span 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 2px;
      padding: 3px 4px;
      min-height: 28px            /* минимальная высота карточки бита */
    }

    /* подпись карточки бита: мелкая, переносится по пробелам */
    .vcard.wbit .vname {
      white-space: normal;
      font-size: 10px;
      line-height: 1.15;
      color: #8b94a7;
      overflow: hidden
    }

    /* лампа состояния бита (цвет активного уровня задаёт виджет) */
    .bitlamp {
      height: 16px;               /* высота лампы */
      border: 1px solid #39414f;
      border-radius: 6px;
      background: #0e1116;   /* inactive level - keep in sync with BITOFF */
      transition: background .15s  /* плавность включения */
    }

    /* включённая лампа слегка светится (цвет = w.col виджета) */
    .bitlamp.on {
      box-shadow: 0 0 6px 0 currentColor
    }
  </style>
</head>

<body>
  <header>
    <h1>SKE-02 Gateway</h1>
    <span id="link" class="tag">…</span><span id="fw" class="tag"></span>
    <button id="btnEdit" onclick="toggleEdit()">&#9998; Раскладка</button>
    <button id="btnW" onclick="toggleW()">&#9633; Виджеты</button>
    <a href="/settings"><button>&#9881; Настройки</button></a>
    <button class="warn" onclick="rebootDev()">Перезагрузить прибор</button>
    <a href="/wifi"><button>Wi-Fi</button></a>
  </header>
  <div id="wpanel" hidden>
    <div id="wlist"></div>
  </div>
  <div id="values"></div>
  <div id="debug">
    отладочная панель
    <button onclick="rescan()">Пересканировать</button>
    <span class="tag" id="ip"></span><span class="tag" id="rss"></span>
    <span class="tag" id="upt"></span><span class="tag" id="heap"></span>
  </div>
  <script>
    const $ = i => document.getElementById(i);
    function hms(t) { const s = t % 60, m = (t / 60 | 0) % 60, h = t / 3600 | 0; return h ? h + 'ч ' + m + 'м' : m ? m + 'м ' + s + 'с' : s + 'с' }
    /* live values window: MeterData_t fields, names as the struct members;
     * bitwise members render as FSETPOINT_/FSTATUS_/FISR_ flag chips */
    const FLAGS = {
      setpoint: ['RATEQMAX', 'RATEHIGH', 'RATELOW', 'FLOW', 'TOTAL', 'GTOTAL', 'BATCH', 'PREEMPTION'],
      status: ['ACCESERROR', 'BATCHER_TIMEOUT', 'BATCHER_PAUSE', 'BATCHER_FINISH', 'RTCERROR', 'RAMERROR', 'REVERSE', 'LOGFULL'],
      isr: ['DOUT0', 'DOUT1', 'DOUT2', 'BUZZER', 'HIGHFREQ', 'LOWFREQ', 'DUTY', 'PHASE']
    };
    /* display labels for the flag chips (bit order must match FLAGS) */
    const FLBL = {
      RATEQMAX: 'Расх>Qмакс', RATEHIGH: 'Расх>макс', RATELOW: 'Расх<мин',
      FLOW: 'Поток', TOTAL: 'Объём', GTOTAL: 'Общий объём', BATCH: 'Порция',
      PREEMPTION: 'Прерывание',
      ACCESERROR: 'Ошибка доступа', BATCHER_TIMEOUT: 'Таймаут порции',
      BATCHER_PAUSE: 'Порция: пауза', BATCHER_FINISH: 'Порция: конец',
      RTCERROR: 'Ошибка RTC', RAMERROR: 'Ошибка RAM', REVERSE: 'Реверс',
      LOGFULL: 'Журнал полон',
      DOUT0: 'Вых0', DOUT1: 'Вых1', DOUT2: 'Вых2', BUZZER: 'Звук',
      HIGHFREQ: 'Частота>', LOWFREQ: 'Частота<', DUTY: 'Скважность', PHASE: 'Фаза'
    };
    // const VFLOATS = ['frequency', 'rate_raw', 'rate_fast', 'rateMLPM', 'rate', 'total_plus', 'total_minus', 'total', 'total_sum', 'totalml_plus', 'totalml_minus', 'gtotal', 'gtotalml', 'kf_value', 'batch'];
    const VFLOATS = ['kf_value', 'batch'];
    const VUINTS = ['pulses_packet', 'pulses'];
    /* display labels only: the JSON keys stay the MeterData_t member
     * names, so the 'm' data itself is untouched */
    const LBL = {
      frequency: 'Частота, Гц',
      rate_raw: 'Расход (raw)',
      rate_fast: 'Расход (fast)',
      rateMLPM: 'Расход, мл/мин',
      rate: 'Расход',
      total_plus: 'Объём +',
      total_minus: 'Объём −',
      total: 'Объём',
      total_sum: 'Объём (сумма)',
      totalml_plus: 'Объём +, мл',
      totalml_minus: 'Объём −, мл',
      gtotal: 'Общий объём',
      gtotalml: 'Общий объём, мл',
      kf_value: 'K-фактор',
      batch: 'Порция',
      pulses_packet: 'Импульсы (пакет)',
      pulses: 'Импульсы',
      setpoint: 'Уставки (биты)',
      status: 'Состояние (биты)',
      isr: 'Флаги ISR (биты)'
    };

    const prec7 = x => Number(x.toPrecision(7));
    const round2 = x => Number(x.toFixed(2));
    /*
     * ── CUSTOM VALUE WIDGETS ────────────────────────────────────────
     * A digital-parameter widget computed by a free-form formula:
     *   calc(d, C) - d = the whole live 'm' values object (fields are
     *   the names in VFLOATS/VUINTS above), C = the named constants
     *   from MY_CONST below. Returns a number.
     * To add your own widget by hand, add ONE line to CUSTOM, e.g.:
     *     total_x2: { calc: (d, C) => d.total * C.k, label: 'Объём ×k', on: true },
     * That's all: the widget auto-appears on the main screen and in
     * the "Виджеты" panel (a saved layout already in localStorage
     * picks the new entry up on the next page load).
     * 'on' is the initial state for a FIRST appearance only; later
     * on/off and drag order are the user's, kept in localStorage.
     */
    const MY_CONST = {
      my_const: 10
    };
    const CUSTOM = {
      // fast_plus_total: { calc: d => r7(d.rate_fast + 10) + d.total, label: 'Частота, Гц', on: true },
      frequency_hz: { calc: d => round2(d.frequency), label: 'Частота, Гц', on: true },
      with_const: { calc: (d, C) => prec7((d.rate_fast + 10) / 10 + d.total - C.my_const), label: 'с константой', on: true }
    };
    /*
     * ── FLOW WIDGET ─────────────────────────────────────────────────
     * Configurable rate widget (like the bar, configured in the panel):
     * input is rateMLPM (ml/min), the two combos pick the volume unit
     * and the time unit; the label composes itself ("Расход, л/мин").
     * The "vol" widget below is the same for gtotal (volume only).
     */
    const VOLU = { ml: 1, l: 1000, m3: 1000000 };   /* ml per volume unit */
    const VOLN = { ml: 'мл', l: 'л', m3: 'м³' };
    const TIMU = { s: 1 / 60, m: 1, h: 60, d: 1440 }; /* minutes per time unit */
    const TIMN = { s: 'с', m: 'мин', h: 'ч', d: 'сут' };
    /*
     * ── BAR WIDGET MODES ────────────────────────────────────────────
     * value source + the setpoint parameter that marks the 100% level
     * (resolved by name from /api/params, see paramsTick)
     */
    const BARM = {
      qmax: { n: 'Расход (Qmax)', src: 'rate', sp: 'Qmax,л' },
      rate: { n: 'Расход', src: 'rate', sp: 'Расход+' },
      total: { n: 'Объём', src: 'total', sp: 'Объём' },
      gtotal: { n: 'Общий', src: 'gtotal', sp: 'Общий' },
      dose: { n: 'Доза', src: 'batch', sp: 'Доза' }
    };
    let SP = {};   /* mode -> setpoint 100% value, refreshed with the tree */
    /* volume widget source modes over the totalml_plus/minus pair */
    const TOTM = {
      plus: { n: 'Объём +', c: d => d.totalml_plus },
      minus: { n: 'Объём −', c: d => d.totalml_minus },
      diff: { n: 'Объём', c: d => d.totalml_plus - d.totalml_minus },
      sum: { n: 'Объём (сумма)', c: d => d.totalml_plus + d.totalml_minus }
    };
    /*
     * ── BIT WIDGET ──────────────────────────────────────────────────
     * One flag bit as a lamp: src group (FLAGS above) + bit index,
     * col = the lamp color of the ACTIVE level. The label is the flag
     * name and wraps on spaces (narrow cards).
     */
    const BITCOL = ['#1d5c2f', '#a23b2e', '#2a5bdb', '#e3b341'];
    const BITOFF = '#14171c';  /* lamp color of the INACTIVE level */
    let vBuilt = false;
    /* rate history: ring of the last 600 s (the values poll is 1 Hz) */
    const RATE_N = 600;
    let rateHist = [], rateMin = 0, rateMax = 1;
    function ratePush(v) {
      rateHist.push(v);
      if (rateHist.length > RATE_N) rateHist.shift();
    }
    function rateDraw() {
      const cv = $('rateChart'); if (!cv) return;
      const dpr = window.devicePixelRatio || 1;
      const w = cv.offsetWidth, h = 120;
      if (cv.width !== w * dpr || cv.height !== h * dpr) { cv.width = w * dpr; cv.height = h * dpr }
      const g = cv.getContext('2d');
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, w, h);
      const n = rateHist.length;
      g.strokeStyle = '#2a3140'; g.lineWidth = 1;
      for (let k = 1; k < 4; k++) { const y = h * k / 4; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke() }
      if (n < 2) { g.fillStyle = '#8b94a7'; g.font = '12px system-ui'; g.fillText('накопление данных…', 8, h / 2); return }
      let lo = Infinity, hi = -Infinity;
      for (const v of rateHist) { if (v < lo) lo = v; if (v > hi) hi = v }
      rateMin = lo; rateMax = hi;
      if (hi - lo < 1e-9) { lo -= 0.5; hi += 0.5 }
      const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
      const X = i => w * i / (RATE_N - 1), Y = v => h - 2 - (v - lo) / (hi - lo) * (h - 4);
      g.beginPath();
      const off = RATE_N - n; /* anchor right so the chart scrolls */
      for (let i = 0; i < n; i++) { const x = X(off + i), y = Y(rateHist[i]); i ? g.lineTo(x, y) : g.moveTo(x, y) }
      g.strokeStyle = '#7aa2f7'; g.lineWidth = 1.5; g.stroke();
      g.lineTo(X(RATE_N - 1), h); g.lineTo(X(off), h); g.closePath();
      g.fillStyle = 'rgba(122,162,247,0.15)'; g.fill();
      const last = rateHist[n - 1];
      g.fillStyle = '#d8dee9'; g.font = '12px ui-monospace,Consolas,monospace';
      g.fillText(last.toFixed(3), 8, 12);
      g.fillStyle = '#8b94a7';
      g.fillText('max ' + (rateMax).toFixed(3), w - 86, 12);
      g.fillText('min ' + (rateMin).toFixed(3), w - 86, h - 4);
    }
    window.addEventListener('resize', rateDraw);
    /*
     * Widgets: the main screen is a list of widget configs kept in
     * localStorage ("widgets"): {k: id, t: chart|val|bits|bar, src: data
     * key, on, min, max}. Base widgets are generated from the MeterData
     * members; "bar" is the torn-stripe progress bar. Drag & drop in the
     * edit mode reorders the array.
     */
    function baseWidgets() {
      const w = [{ k: 'rateChart', t: 'chart', src: 'rate', on: true },
      { k: 'bar_qmax', t: 'bar', mode: 'qmax', on: true }];
      for (const n of VFLOATS.concat(VUINTS)) w.push({ k: n, t: 'val', src: n, on: true });
      /* old group bit widgets ("bits_*") are gone: single-bit lamps only */
      for (const id in CUSTOM) w.push({ k: id, t: 'cval', on: CUSTOM[id].on !== false });
      w.push({ k: 'flow_l_m', t: 'flow', vol: 'l', time: 'm', on: true });
      w.push({ k: 'vol_l', t: 'vol', vol: 'l', on: true });
      w.push({ k: 'tot_plus_l', t: 'tot', m: 'plus', vol: 'l', on: true });
      w.push({ k: 'bit_flow', t: 'bit', src: 'setpoint', b: 3, col: BITCOL[0], on: true });
      return w;
    }
    let widgets = null;
    /*
     * Persistence: localStorage is the instant cache, the gateway NVS
     * (via /api/widgets) is the source of truth. rev bumps on every
     * "Сохранить"; a newer server rev wins on the next page load.
     */
    let wRev = parseInt(localStorage.getItem('wrev')) || 0;
    let wDirty = false;
    function saveWidgets() {
      localStorage.setItem('widgets', JSON.stringify(widgets));
      wDirty = true;
      const m = $('wmsg'); if (m) m.textContent = 'не сохранено';
    }
    async function wSave() {
      try {
        const body = JSON.stringify({ rev: wRev + 1, cfg: widgets });
        const r = await (await fetch('/api/widgets', { method: 'POST', body })).json();
        if (!r.ok) { alert('шлюз не смог записать конфиг'); return }
        wRev++; localStorage.setItem('wrev', wRev); wDirty = false;
        const m = $('wmsg'); if (m) m.textContent = 'сохранено (rev ' + wRev + ')';
      } catch (e) { alert('нет ответа от шлюза') }
    }
    async function wSync() {
      try {
        const d = await (await fetch('/api/widgets')).json();
        if (d.cfg && Array.isArray(d.cfg) && d.rev > wRev) {
          widgets = d.cfg; wRev = d.rev;
          localStorage.setItem('widgets', JSON.stringify(widgets));
          localStorage.setItem('wrev', wRev);
          vBuild();
        } else if (d.rev === 0 && widgets.length && !wDirty) {
          /* first meet with a blank gateway: migrate the local config */
          const body = JSON.stringify({ rev: 1, cfg: widgets });
          const r = await (await fetch('/api/widgets', { method: 'POST', body })).json();
          if (r.ok) { wRev = 1; localStorage.setItem('wrev', 1) }
        }
      } catch (e) { }
    }
    function loadWidgets() {
      try { widgets = JSON.parse(localStorage.getItem('widgets')) } catch (e) { widgets = null }
      if (!Array.isArray(widgets)) {
        widgets = baseWidgets();
        /* one-time migration: keep the old drag order ("vorder") */
        try {
          const o = JSON.parse(localStorage.getItem('vorder'));
          if (Array.isArray(o))
            widgets.sort((a, b) => (o.indexOf(a.k) + 1 || 1e9) - (o.indexOf(b.k) + 1 || 1e9));
        } catch (e) { }
        saveWidgets();
      }
      /* drop configs whose source disappeared, add new data keys */
      widgets = widgets.filter(w => w.t === 'bar' || w.t === 'flow' || w.t === 'vol' || w.t === 'tot' || w.t === 'bit' || (w.t === 'cval' && CUSTOM[w.k]) ||
        (w.src && (w.src === 'rate' || VFLOATS.includes(w.src) || VUINTS.includes(w.src))));
      for (const w of widgets) if (w.t === 'bar' && !BARM[w.mode]) w.mode = 'qmax';
      for (const w of widgets) if ((w.t === 'vol' || w.t === 'tot') && !VOLU[w.vol]) w.vol = 'l';
      for (const w of widgets) if (w.t === 'tot' && !TOTM[w.m]) w.m = 'plus';
      for (const w of widgets)
        if (w.t === 'bit' && (!(w.src in FLAGS) || !(w.b >= 0 && w.b < FLAGS[w.src].length))) { w.src = 'setpoint'; w.b = 0 }
      for (const w of widgets) if (w.t === 'bit' && !/^#[0-9a-fA-F]{6}$/.test(w.col || '')) w.col = BITCOL[0];
      for (const w of widgets) if (w.t === 'bar' && !BARM[w.mode]) w.mode = 'qmax';
      /* structural widgets (tied to the 'm' data or the CUSTOM block)
       * reappear if missing; the configurable ones (bar/flow/vol/tot)
       * are fully user-managed and STAY deleted */
      for (const b of baseWidgets())
        if (b.t !== 'bar' && b.t !== 'flow' && b.t !== 'vol' && b.t !== 'tot' &&
            !widgets.some(w => w.k === b.k))
          widgets.push(b);
    }
    function widgetName(w) {
      if (w.t === 'chart') return 'График: Расход, 10 мин';
      if (w.t === 'bar') return 'Бар: ' + (BARM[w.mode] ? BARM[w.mode].n : w.mode);
      if (w.t === 'cval') return (CUSTOM[w.k] && CUSTOM[w.k].label) || w.k;
      if (w.t === 'flow') return 'Расход, ' + VOLN[w.vol] + '/' + TIMN[w.time];
      if (w.t === 'vol') return 'Общий, ' + VOLN[w.vol];
      if (w.t === 'tot') return TOTM[w.m].n + ', ' + VOLN[w.vol];
      if (w.t === 'bit') return (FLBL[FLAGS[w.src][w.b]] || FLAGS[w.src][w.b]);
      return LBL[w.src] || w.src;
    }
    function widgetHtml(w) {
      if (w.t === 'chart')
        return '<div class="vcard chart" data-k="' + w.k + '"><div class="vname">Расход, последние 10 мин</div><canvas id="rateChart"></canvas></div>';
      if (w.t === 'val')
        return '<div class="vcard" data-k="' + w.k + '"><div class="vname">' + (LBL[w.src] || w.src) + '</div><div class="vval" id="vf_' + w.src + '">—</div></div>';
      if (w.t === 'cval') /* custom: src × factor, label from CUSTOM */
        return '<div class="vcard" data-k="' + w.k + '"><div class="vname">' + widgetName(w) + '</div><div class="vval" id="vfc_' + w.k + '">—</div></div>';
      if (w.t === 'flow') /* rateMLPM converted to vol/time units */
        return '<div class="vcard" data-k="' + w.k + '"><div class="vname">' + widgetName(w) + '</div><div class="vval" id="vfl_' + w.k + '">—</div></div>';
      if (w.t === 'vol') /* gtotalml converted to the volume unit */
        return '<div class="vcard" data-k="' + w.k + '"><div class="vname">' + widgetName(w) + '</div><div class="vval" id="vvv_' + w.k + '">—</div></div>';
      if (w.t === 'tot') /* totalml_plus/minus combination -> volume unit */
        return '<div class="vcard" data-k="' + w.k + '"><div class="vname">' + widgetName(w) + '</div><div class="vval" id="vtv_' + w.k + '">—</div></div>';
      if (w.t === 'bit') /* single flag bit as a lamp, label wraps */
        return '<div class="vcard wbit" data-k="' + w.k + '"><div class="vname">' + widgetName(w) + '</div><div class="bitlamp" id="bl_' + w.k + '"></div></div>';
      /* bar: torn-stripe progress bar clamped to min..max, no value text */
      return '<div class="vcard wbar" data-k="' + w.k + '"><div class="vname">' + widgetName(w).replace('Бар: ', '') + '<span class="bpct" id="bp_' + w.k + '"></span></div><div class="hbar"><div class="hfill" id="hf_' + w.k + '"></div></div></div>';
    }
    function vBuild() {
      loadWidgets();
      $('values').innerHTML = widgets.filter(w => w.on).map(widgetHtml).join('');
      vBuilt = true; rateDraw(); setDrag(); renderPanel();
    }
    let editing = false;
    function toggleEdit() {
      editing = !editing;
      document.body.className = editing ? 'edit' : '';
      $('btnEdit').classList.toggle('act', editing);
      setDrag();
    }
    function setDrag() {
      const el = $('values'); if (!el) return;
      [...el.children].forEach(c => c.draggable = editing);
    }
    let dragK = null;
    document.addEventListener('dragstart', e => {
      const c = e.target.closest && e.target.closest('.vcard');
      if (!editing || !c) return;
      dragK = c.dataset.k; c.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    document.addEventListener('dragend', e => {
      const c = e.target.closest && e.target.closest('.vcard');
      if (c) c.classList.remove('dragging');
      dragK = null;
    });
    document.addEventListener('dragover', e => {
      if (!editing || !dragK) return;
      if (e.target.closest && e.target.closest('.vcard')) e.preventDefault();
    });
    document.addEventListener('drop', e => {
      const c = e.target.closest && e.target.closest('.vcard');
      if (!editing || !dragK || !c || c.dataset.k === dragK) return;
      e.preventDefault();
      const src = document.querySelector('.vcard[data-k="' + dragK + '"]');
      if (!src) return;
      /* insert before/after by the pointer half of the target card */
      const r = c.getBoundingClientRect();
      const after = (e.clientY - r.top) > r.height / 2 || (e.clientX - r.left) > r.width / 2;
      c.parentNode.insertBefore(src, after ? c.nextSibling : c);
      /* the DOM order of the enabled cards IS the widget order */
      const ord = [...$('values').children].map(x => x.dataset.k);
      widgets.sort((a, b) =>
        (ord.indexOf(a.k) + 1 || 1e9) - (ord.indexOf(b.k) + 1 || 1e9));
      saveWidgets();
    });
    /* ---------------------------------------------------------------- */
    /* the "Виджеты" panel: enable/disable, bar min/max, add/remove     */
    function toggleW() {
      const p = $('wpanel');
      p.hidden = !p.hidden;
      $('btnW').classList.toggle('act', !p.hidden);
      renderPanel();
    }
    function renderPanel() {
      const p = $('wlist'); if (!p) return;
      let h = '<div class="wrow"><button id="btnWsave" onclick="wSave()">Сохранить в шлюз</button>' +
        '<span id="wmsg" class="flash">' + (wDirty ? 'не сохранено' : 'сохранено (rev ' + wRev + ')') + '</span></div>';
      widgets.forEach((w, i) => {
        h += '<div class="wrow"><label><input type="checkbox"' + (w.on ? ' checked' : '') +
          ' onchange="wToggle(' + i + ',this.checked)"> ' + widgetName(w) + '</label>';
        /* ── БАРГРАФ ('bar'): источник-режим; 100% = уставка режима ── */
        if (w.t === 'bar') {
          let sb = '<select onchange="wFlow(' + i + ',\'mode\',this.value)">';
          for (const m in BARM) sb += '<option value="' + m + '"' + (w.mode === m ? ' selected' : '') + '>' + BARM[m].n + '</option>';
          h += ' ' + sb + '</select> <button class="warn" onclick="wDel(' + i + ')">удалить</button>';
        }
        /* ── РАСХОД ('flow'): единицы объёма + времени, вход rateMLPM ── */
        if (w.t === 'flow') {
          const sel = (which, map, names) => {
            let s = '<select onchange="wFlow(' + i + ',\'' + which + '\',this.value)">';
            for (const u in map) s += '<option value="' + u + '"' + (w[which] === u ? ' selected' : '') + '>' + names[u] + '</option>';
            return s + '</select>';
          };
          h += ' объём ' + sel('vol', VOLU, VOLN) + ' время ' + sel('time', TIMU, TIMN) +
            ' <button class="warn" onclick="wDel(' + i + ')">удалить</button>';
        }
        /* ── ОБЩИЙ ('vol'): единица объёма, вход gtotalml ── */
        if (w.t === 'vol') {
          let s = '<select onchange="wFlow(' + i + ',\'vol\',this.value)">';
          for (const u in VOLU) s += '<option value="' + u + '"' + (w.vol === u ? ' selected' : '') + '>' + VOLN[u] + '</option>';
          h += ' объём ' + s + '</select>' +
            ' <button class="warn" onclick="wDel(' + i + ')">удалить</button>';
        }
        /* ── ОБЪЁМ ('tot'): комбинация totalml_plus/minus + единица ── */
        if (w.t === 'tot') {
          let sm = '<select onchange="wFlow(' + i + ',\'m\',this.value)">';
          for (const u in TOTM) sm += '<option value="' + u + '"' + (w.m === u ? ' selected' : '') + '>' + TOTM[u].n + '</option>';
          let sv = '<select onchange="wFlow(' + i + ',\'vol\',this.value)">';
          for (const u in VOLU) sv += '<option value="' + u + '"' + (w.vol === u ? ' selected' : '') + '>' + VOLN[u] + '</option>';
          h += ' ' + sm + '</select> ' + sv + '</select>' +
            ' <button class="warn" onclick="wDel(' + i + ')">удалить</button>';
        }
        /* ── БИТ ('bit'): группа флагов + номер бита + цвет активного уровня ── */
        if (w.t === 'bit') {
          let sg = '<select onchange="wBit(' + i + ',\'src\',this.value)">';
          for (const g in FLAGS) sg += '<option value="' + g + '"' + (w.src === g ? ' selected' : '') + '>' + (LBL[g] || g) + '</option>';
          let sb = '<select onchange="wBit(' + i + ',\'b\',this.value)">';
          FLAGS[w.src].forEach((f, bi) => sb += '<option value="' + bi + '"' + (w.b === bi ? ' selected' : '') + '>' + (FLBL[f] || f) + '</option>');
          h += ' ' + sg + '</select> ' + sb + '</select>' +
            ' цвет <input type="color" value="' + w.col + '" onchange="wBit(' + i + ',\'col\',this.value)">' +
            ' <button class="warn" onclick="wDel(' + i + ')">удалить</button>';
        }
        h += '</div>';
      });
      const opts = VFLOATS.map(n => '<option value="' + n + '">' + (LBL[n] || n) + '</option>').join('');
      /* строки создания новых виджетов: ＋ <тип> */
      h += '<div class="wrow">＋ барграф <select id="nbMode">';   /* 'bar' */
      for (const m in BARM) h += '<option value="' + m + '"' + (m === 'qmax' ? ' selected' : '') + '>' + BARM[m].n + '</option>';
      h += '</select> <button onclick="wAddBar()">Добавить</button></div>';
      h += '<div class="wrow">＋ расход <select id="nwVol">' +      /* 'flow' */
        '<option value="ml">мл</option><option value="l" selected>л</option><option value="m3">м³</option></select>' +
        ' / <select id="nwTime"><option value="s">с</option><option value="m" selected>мин</option>' +
        '<option value="h">ч</option><option value="d">сут</option></select>' +
        ' <button onclick="wAddFlow()">Добавить</button></div>';
      h += '<div class="wrow">＋ общий объём <select id="nvVol">' + /* 'vol' */
        '<option value="ml">мл</option><option value="l" selected>л</option><option value="m3">м³</option></select>' +
        ' <button onclick="wAddVol()">Добавить</button></div>';
      h += '<div class="wrow">＋ объём <select id="ntMode">' +      /* 'tot' */
        '<option value="plus" selected>Объём +</option><option value="minus">Объём −</option>' +
        '<option value="diff">Объём (+−)</option><option value="sum">Объём (сумма)</option></select>' +
        ' <select id="ntVol"><option value="ml">мл</option><option value="l" selected>л</option><option value="m3">м³</option></select>' +
        ' <button onclick="wAddTot()">Добавить</button></div>';
      h += '<div class="wrow">＋ бит <select id="nbiSrc">';         /* 'bit' */
      for (const g in FLAGS) h += '<option value="' + g + '"' + (g === 'setpoint' ? ' selected' : '') + '>' + (LBL[g] || g) + '</option>';
      h += '</select> <select id="nbiBit"></select>' +
        ' цвет <input id="nbiCol" type="color" value="' + BITCOL[0] + '">' +
        ' <button onclick="wAddBit()">Добавить</button></div>';
      p.innerHTML = h;
      { /* prefill the bit list of the "＋ бит" row */
        const g = $('nbiSrc').value, sel = $('nbiBit');
        sel.innerHTML = FLAGS[g].map((f, bi) => '<option value="' + bi + '">' + (FLBL[f] || f) + '</option>').join('');
      }
    }
    /* общие операции панели: показ, правка поля, удаление */
    function wToggle(i, on) { widgets[i].on = on; saveWidgets(); vBuild() }
    function wFlow(i, which, v) { widgets[i][which] = v; saveWidgets(); vBuild() }
    function wDel(i) { widgets.splice(i, 1); saveWidgets(); vBuild() }
    /* создатели новых виджетов, по одному на тип */
    function wAddBar() {           /* 'bar'  — барграф */
      widgets.push({ k: 'bar' + Date.now(), t: 'bar', mode: $('nbMode').value, on: true });
      saveWidgets(); vBuild();
    }
    function wAddFlow() {          /* 'flow' — расход */
      widgets.push({ k: 'flow' + Date.now(), t: 'flow', vol: $('nwVol').value, time: $('nwTime').value, on: true });
      saveWidgets(); vBuild();
    }
    function wAddVol() {           /* 'vol'  — общий объём */
      widgets.push({ k: 'vol' + Date.now(), t: 'vol', vol: $('nvVol').value, on: true });
      saveWidgets(); vBuild();
    }
    function wAddTot() {           /* 'tot'  — объём (+/−/разность/сумма) */
      widgets.push({ k: 'tot' + Date.now(), t: 'tot', m: $('ntMode').value, vol: $('ntVol').value, on: true });
      saveWidgets(); vBuild();
    }
    function wAddBit() {           /* 'bit'  — лампа бита */
      widgets.push({ k: 'bit' + Date.now(), t: 'bit', src: $('nbiSrc').value,
                     b: parseInt($('nbiBit').value) || 0, col: $('nbiCol').value, on: true });
      saveWidgets(); vBuild();
    }
    /* bit combo: rebuild the bit list when the source group changes */
    function wBit(i, which, v) {
      widgets[i][which] = which === 'b' ? parseInt(v) : v;
      saveWidgets(); vBuild();
    }
    document.addEventListener('change', e => {
      if (e.target.id !== 'nbiSrc') return;
      const sel = $('nbiBit');
      sel.innerHTML = FLAGS[e.target.value]
        .map((f, bi) => '<option value="' + bi + '">' + (FLBL[f] || f) + '</option>').join('');
    });
    /* vApply: раз в кадр 'm' обновляет карточки всех типов виджетов */
    function vApply(d) {
      const barLo = vApply.lo || (vApply.lo = {}), barHi = vApply.hi || (vApply.hi = {});
      for (const n of VFLOATS) { const e = $('vf_' + n); if (e && d[n] !== undefined) e.textContent = d[n] }
      for (const n of VUINTS) { const e = $('vf_' + n); if (e && d[n] !== undefined) e.textContent = d[n] }
      /* 'cval' КАСТОМНЫЕ: формула calc(d, MY_CONST) из блока CUSTOM */
      for (const w of widgets || []) {
        if (w.t !== 'cval' || !w.on) continue;
        const c = CUSTOM[w.k], e = $('vfc_' + w.k);
        if (c && e && c.calc) {
          /* no forced formatting here: the calc's own rounding (e.g.
           * Number(x.toPrecision(4))) is what the card must show */
          const v = c.calc(d, MY_CONST);
          if (isFinite(v)) e.textContent = String(v)
        }
      }
      /* 'flow' РАСХОД: rateMLPM (мл/мин) -> выбранные единицы объёма/времени */
      for (const w of widgets || []) {
        if (w.t !== 'flow' || !w.on) continue;
        const e = $('vfl_' + w.k);
        if (e && d.rateMLPM !== undefined)
          e.textContent = Number((d.rateMLPM / VOLU[w.vol] * TIMU[w.time]).toPrecision(4))
      }
      /* 'vol' ОБЩИЙ: gtotalml -> единица объёма, без времени */
      for (const w of widgets || []) {
        if (w.t !== 'vol' || !w.on) continue;
        const e = $('vvv_' + w.k);
        if (e && d.gtotalml !== undefined)
          e.textContent = Number((d.gtotalml / VOLU[w.vol]).toPrecision(4))
      }
      /* 'bit' БИТ: лампа зажигается выбранным цветом при бите = 1 */
      for (const w of widgets || []) {
        if (w.t !== 'bit' || !w.on) continue;
        const e = $('bl_' + w.k);
        if (e && d[w.src] !== undefined) {
          const on = (d[w.src] >> w.b) & 1;
          e.style.background = on ? w.col : BITOFF;
          e.style.color = w.col;               /* currentColor glow */
          e.classList.toggle('on', !!on);
        }
      }
      /* 'tot' ОБЪЁМ: комбинация totalml_plus/minus -> единица объёма */
      for (const w of widgets || []) {
        if (w.t !== 'tot' || !w.on) continue;
        const e = $('vtv_' + w.k), m = TOTM[w.m];
        if (e && m && d.totalml_plus !== undefined && d.totalml_minus !== undefined) {
          const v = m.c(d) / VOLU[w.vol];
          if (isFinite(v)) e.textContent = Number(v.toPrecision(4))
        }
      }
      /* 'bar' БАРГРАФ: заполнение = значение / уставка режима (100%) */
      for (const w of widgets || []) {
        if (w.t !== 'bar' || !w.on) continue;
        const m = BARM[w.mode], f = $('hf_' + w.k);
        const v = m ? d[m.src] : undefined;
        if (f && v !== undefined) {
          /* 100% = the setpoint parameter of the mode (paramsTick);
           * fallback until it is known: running min/max like the chart */
          let hi = SP[w.mode];
          if (!(hi > 0)) {
            if (!(w.k in barLo) || v < barLo[w.k]) barLo[w.k] = v;
            if (!(w.k in barHi) || v > barHi[w.k]) barHi[w.k] = v;
            hi = barHi[w.k];
            if (hi - (barLo[w.k] || 0) < 1e-9) hi = (barLo[w.k] || 0) + 1;
          }
          const pct = Math.max(0, Math.min(100, v / hi * 100));
          f.style.width = pct.toFixed(1) + '%';
          const t = $('bp_' + w.k);
          if (t) t.textContent = pct.toFixed(0) + '%';
        }
      }
    }
    async function valuesTick() {
      try {
        const d = await (await fetch('/api/values')).json();
        if (d.link !== undefined) {
          $('link').textContent = d.link ? 'UART: связь есть' : 'UART: нет связи';
          $('link').className = 'tag ' + (d.link ? 'ok' : 'bad');
        }
        if (!d.ok) { return }
        if (!vBuilt) vBuild();
        vApply(d);
        if (d.rate !== undefined) { ratePush(d.rate); rateDraw() }
      } catch (e) { }
    }
    setInterval(valuesTick, 200); valuesTick();
    async function infoTick() {
      try {
        const r = await (await fetch('/api/info')).json();
        $('fw').textContent = r.fw + ' · параметров: ' + r.count;
        $('ip').textContent = r.ip;
        $('rss').textContent = r.ap ? r.rssi + ' dBm' : r.ssid + ': ' + r.rssi + ' dBm';
        $('upt').textContent = 'uptime ' + hms(r.uptime); $('heap').textContent = 'heap ' + (r.heap / 1024 | 0) + ' KiB';
      } catch (e) { }
    }
    /* setpoints for the bar 100% levels: floats from the settings tree;
     * "Qmax,л" is matched by name anywhere, the rest strictly inside the
     * "Уставки" submenu (those names repeat across the tree) */
    async function paramsTick() {
      try {
        const d = await (await fetch('/api/params')).json();
        SP = {};
        for (const p of d.params) {
          if (p.t !== 0 || !p.w || !p.n) continue;
          for (const m in BARM)
            if (p.n === BARM[m].sp && (m === 'qmax' || p.tb === 'Уставки'))
              SP[m] = parseFloat(p.v);
        }
      } catch (e) { }
    }
    paramsTick(); setInterval(paramsTick, 30000);
    wSync();
    async function rescan() { await fetch('/api/rescan', { method: 'POST' }); infoTick(); paramsTick() }
    function rebootDev() { if (confirm('Перезагрузить прибор?')) fetch('/api/reboot', { method: 'POST' }) }
    infoTick(); setInterval(infoTick, 5000);
  </script>
