<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SKE-02 Gateway</title>
  <style>
    /* ==================================================================
     * STYLE MAP (index.html - главная страница мониторинга)
     *   1. общие: body, header, h1, .tag/.ok/.bad, button, #debug
     *   2. сетка виджетов: #values, .vcard (+ .wbar/.wbit/.chart/.wide),
     *      .vname (подпись), .vval (число)
     *   3. режим правки раскладки: body.edit*, #btnEdit.act
     *   4. виджет БАРГРАФ (.vcard.wbar): .hbar (дорожка), .hfill
     *      (рваная заливка), .bpct (проценты)
     *   6. виджет БИТ (.vcard.wbit): .bitlamp (лампа)
     * ================================================================== */

    /* --- 1. общие ---------------------------------------------------- */

    body {
      font: 13px/1.45 system-ui, sans-serif;
      /* background: #14171c; */
      background: #000000;
      /* цвет фона всей страницы */
      color: #ffffff;
      /* основной цвет текста */
      margin: 0;
      padding: 12px
        /* внешний отступ страницы */
    }

    /* шапка: заголовок, метка связи, шестерёнка справа */
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px
    }

    /* шестерёнка без надписи, прижата вправо; открывает /panel */
    .gear {
      margin-left: auto;
      font-size: 22px;
      line-height: 1;
      color: #d8dee9;
      text-decoration: none;
      padding: 2px 6px;
      border-radius: 4px
    }

    .gear:hover {
      background: #2a3140
    }

    h1 {
      font-size: 18px;
      /* размер заголовка "SKE-02 Gateway" */
      margin: 0 8px 0 0
    }

    /* маленькая метка-пилюля в шапке (UART: связь, fw, ip...) */
    .tag {
      background: #2a3140;
      /* фон метки */
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 12px;
      white-space: nowrap
    }

    .ok {
      background: #1d5c2f
    }

    /* метка связи: зелёный (связь есть) */
    .bad {
      background: #6c2431
    }

    /* метка связи: красный (нет связи) */

    /* все обычные кнопки */
    button {
      background: #1e3264;
      /* синий фон кнопки */
      color: #fff;
      border: 0;
      border-radius: 4px;
      padding: 5px 5px;
      /* паддинг кнопки (верт гориз) */
      cursor: pointer;
      font-size: 12px
    }

    button.warn {
      background: #7d3127
    }

    /* красная кнопка (Перезагрузить, удалить) */

    /* отладочная панель внизу (ip/rssi/uptime/heap) */
    #debug {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin: 0 0 8px 0;
      padding: 4px 8px;
      border: 1px dashed #39414f;
      border-radius: 4px;
      color: #8b94a7;
      font-size: 12px
    }

    #debug .tag {
      background: transparent;
      border: 1px solid #2a3140;
      padding: 1px 6px
    }

    #debug button {
      font-size: 12px;
      padding: 4px 4px
    }

    /* --- 2. сетка виджетов ------------------------------------------- */

    /* контейнер всех карточек-виджетов (#values в body) */
    #values {
      display: grid;
      /* half-width tracks: a normal card spans 2 tracks (a full cell,
       * 10 chars of 15px monospace), a bit card spans 1 -> two bits
       * pack into one value-card slot */
      grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
      gap: 6px;
      /* расстояние между карточками */
      margin: 0 0 10px 0
    }

    /* --- МОБИЛЬНАЯ ВЕРСИЯ (узкий экран): сетка фиксировано 4 трека
     *   параметр/значение  span 2 -> не более ДВУХ в ряд
     *   барграф            span 4 -> не более ОДНОГО в ряд
     *   бит                span 1 -> не более ЧЕТЫРЁХ в ряд
     *   график             1/-1   -> один на всю ширину (как и было) */
    @media (max-width: 640px) {
      #values {
        grid-template-columns: repeat(4, minmax(0, 1fr))
      }

      .vcard {
        grid-column: auto / span 2
      }

      .vcard.wbit {
        grid-column: auto / span 1
      }
    }

    /* обычная карточка занимают полный слот */
    .vcard {
      grid-column: span 2
    }

    /* карточка барграфа занимают 2 слот */
    .vcard.wbar {
      grid-column: span 4
    }

    /* карточка виджета общего вида (значение, расход, объём...) */
    .vcard {
      background: #1b202a;
      /* фон карточки */
      border: 2px solid #2a3140;
      /* рамка карточки */
      border-radius: 4px;
      padding: 2px 4px
        /* vertical horizontal */
    }

    /* подпись (имя параметра) внутри карточки */
    .vname {
      color: #ffffff;
      /* серый цвет подписи */
      font-size: 11px
        /* размер шрифта подписи */
    }

    /* числовое значение внутри карточки */
    .vval {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 16px;
      /* размер цифр значения */
      white-space: nowrap
    }

    .vcard.wide {
      grid-column: span 4
    }

    /* широкая карточка (2 слота) */

    /* карточка графика расхода - на всю ширину строки */
    .vcard.chart {
      grid-column: 1/-1
    }

    /* canvas самого графика внутри карточки */
    .vcard.chart canvas {
      width: 100%;
      height: 120px;
      /* высота графика */
      display: block
    }

    /* --- 3. режим правки раскладки ("✎ Раскладка" включает body.edit) - */

    #btnEdit.act {
      background: #1d5c2f
    }

    /* кнопка Раскладка в активном режиме */

    body.edit .vcard {
      outline: 1px dashed #39414f;
      /* перетаскиваемая карточка: пунктир */
      cursor: grab
    }

    body.edit .vcard.dragging {
      /* карточка в момент перетаскивания */
      opacity: .35;
      cursor: grabbing
    }

    body.edit #values {
      user-select: none
    }

    /* не выделять текст при драге */

    /* --- 4. виджет БАРГРАФ (t:'bar', .vcard.wbar) --------------------- */

    /* дорожка барграфа: тёмный фон, заливка едет внутри */
    .hbar {
      background: #0e1116;
      /* цвет пустой дорожки */
      border: 1px solid #39414f;
      border-radius: 2px;
      height: 14px;
      /* высота дорожки (в карточке ниже - 16) */
      margin-top: 6px;
      overflow: hidden
    }

    /* torn stripe fill: solid dashes with gaps */
    .hfill {
      height: 100%;
      width: 0;
      transition: width .25s ease-out;
      /* плавность движения заливки */
      /* green torn stripe: wide dashes, hairline gaps */
      background: repeating-linear-gradient(90deg, #3fbf5f 0 10px, transparent 10px 11px)
        /* цвет штриха */
    }

    /* bar card: label + the stripe, 3px horizontal padding */
    .vcard.wbar {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 3px
    }

    /* дорожка внутри карточки барграфа - чуть выше */
    .vcard.wbar .hbar {
      height: 16px;
      margin-top: 0
    }

    /* percent readout, right-aligned in the bar label line */
    .bpct {
      float: right;
      color: #ffffff;
      font-size: 12px;
      font-family: ui-monospace, Consolas, monospace
    }

    /* --- 5. виджет БИТ (t:'bit', .vcard.wbit) ------------------------- */

    /* bit-state card: HALF a value-cell wide (span 1 of the 2-track
     * cell) and compact, so two of them pack into one slot; the label
     * wraps on spaces, the lamp takes the chosen active color */
    .vcard.wbit {
      grid-column: span 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 2px;
      padding: 3px 4px;
      min-height: 28px
        /* минимальная высота карточки бита */
    }

    /* подпись карточки бита: мелкая, переносится по пробелам */
    .vcard.wbit .vname {
      white-space: normal;
      font-size: 10px;
      line-height: 1.15;
      color: #ffffff;
      overflow: hidden
    }

    /* лампа состояния бита (цвет активного уровня задаёт виджет) */
    .bitlamp {
      height: 16px;
      /* высота лампы */
      border: 1px solid #39414f;
      border-radius: 6px;
      background: #0e1116;
      /* inactive level - keep in sync with BITOFF */
      transition: background .15s
        /* плавность включения */
    }

    /* включённая лампа слегка светится (цвет = w.col виджета) */
    .bitlamp.on {
      box-shadow: 0 0 6px 0 currentColor
    }

    /* --- 6. виджет КНОПКА (.vcard.wbtn) ------------------------------ */
    /* квадрат шириной с индикатор (высота = ширине), подпись в теле;
     * цвет фона задаётся видом кнопки (СТОП/СТАРТ/ПАУЗА/СБРОС) */
    .vcard.wbtn {
      grid-column: span 1;
      box-sizing: border-box;
      /* aspect-ratio считает с рамкой */
      aspect-ratio: 1 / 1;
      /* высота = ширине */
      align-self: start;
      /* иначе grid растянет по высоте ряда */
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      user-select: none;
      font-weight: 600;
      font-size: 12px;
      color: #fff;
      padding: 3px 5px
    }

    .vcard.wbtn:active {
      filter: brightness(1.3)
        /* отклик на нажатие */
    }

    /* --- 7. виджет ВВОД УСТАВКИ (.vcard.winp) ------------------------ */
    /* размеры и паддинги как у барграфа: полный слот, число справа */
    .vcard.winp {
      grid-column: span 4;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 3px
    }

    .vcard.winp input {
      background: #0e1116;
      color: #d8dee9;
      border: 1px solid #39414f;
      border-radius: 4px;
      padding: 4px 6px;
      font: 14px ui-monospace, Consolas, monospace;
      text-align: right
    }
  </style>
</head>

<body>
  <header>
    <h1>SKE-02 Gateway</h1>
    <span id="link" class="tag">…</span>
    <!-- шестерёнка справа вверху: страница панели (раскладка/виджеты/
         Wi-Fi/перезагрузка/прибор/профили); отладочная панель теперь там -->
    <a href="/panel" class="gear">&#9881;</a>
  </header>
  <div id="values"></div>
  <!-- панели редактирования всё ещё живут здесь (режим правки и
       «Виджеты» открываются с /panel через /?edit=1 и /?widgets=1) -->
  <button id="btnEdit" onclick="toggleEdit()" hidden>&#9998; Раскладка</button>
  <script src="/shared.js"></script>
  <script>
    function vBuild() {
      loadWidgets();
      $('values').innerHTML = widgets.filter(w => w.on).map(widgetHtml).join('');
      vBuilt = true; chartDrawAll(); setDrag(); renderPanel();
    }
    let editing = false;
    function toggleEdit() {
      editing = !editing;
      document.body.className = editing ? 'edit' : '';
      $('btnEdit').classList.toggle('act', editing);
      setDrag();
    }
    function setDrag() {
      const el = $('values'); if (!el) return;
      [...el.children].forEach(c => c.draggable = editing);
    }
    let dragK = null;
    document.addEventListener('dragstart', e => {
      const c = e.target.closest && e.target.closest('.vcard');
      if (!editing || !c) return;
      dragK = c.dataset.k; c.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    document.addEventListener('dragend', e => {
      const c = e.target.closest && e.target.closest('.vcard');
      if (c) c.classList.remove('dragging');
      dragK = null;
    });
    document.addEventListener('dragover', e => {
      if (!editing || !dragK) return;
      if (e.target.closest && e.target.closest('.vcard')) e.preventDefault();
    });
    document.addEventListener('drop', e => {
      const c = e.target.closest && e.target.closest('.vcard');
      if (!editing || !dragK || !c || c.dataset.k === dragK) return;
      e.preventDefault();
      const src = document.querySelector('.vcard[data-k="' + dragK + '"]');
      if (!src) return;
      /* insert before/after by the pointer half of the target card */
      const r = c.getBoundingClientRect();
      const after = (e.clientY - r.top) > r.height / 2 || (e.clientX - r.left) > r.width / 2;
      c.parentNode.insertBefore(src, after ? c.nextSibling : c);
      /* the DOM order of the enabled cards IS the widget order */
      const ord = [...$('values').children].map(x => x.dataset.k);
      widgets.sort((a, b) =>
        (ord.indexOf(a.k) + 1 || 1e9) - (ord.indexOf(b.k) + 1 || 1e9));
      saveWidgets();
    });
    /* vApply: раз в кадр 'm' обновляет карточки всех типов виджетов */
    function vApply(d) {
      const barLo = vApply.lo || (vApply.lo = {}), barHi = vApply.hi || (vApply.hi = {});
      for (const n of VFLOATS) { const e = $('vf_' + n); if (e && d[n] !== undefined) e.textContent = d[n] }
      for (const n of VUINTS) { const e = $('vf_' + n); if (e && d[n] !== undefined) e.textContent = d[n] }
      /* 'cval' КАСТОМНЫЕ: формула calc(d, MY_CONST) из блока CUSTOM */
      for (const w of widgets || []) {
        if (w.t !== 'cval' || !w.on) continue;
        const c = CUSTOM[w.k], e = $('vfc_' + w.k);
        if (c && e && c.calc) {
          /* no forced formatting here: the calc's own rounding (e.g.
           * Number(x.toPrecision(4))) is what the card must show */
          const v = c.calc(d, MY_CONST);
          if (isFinite(v)) e.textContent = String(v)
        }
      }
      /* 'par' ПАРАМЕТР: авто = как отдал прибор, иначе пересчёт в
       * выбранные единицы (объём, для расхода ещё и период) */
      for (const w of widgets || []) {
        if (w.t !== 'par' || !w.on) continue;
        const e = $('vp_' + w.k), v = parValue(w, d);
        if (e && v !== undefined && isFinite(v))
          e.textContent = Number(v.toPrecision(4))
      }
      /* 'bit' БИТ: лампа зажигается выбранным цветом при бите = 1 */
      for (const w of widgets || []) {
        if (w.t !== 'bit' || !w.on) continue;
        const e = $('bl_' + w.k);
        if (e && d[w.src] !== undefined) {
          const on = (d[w.src] >> w.b) & 1;
          e.style.background = on ? w.col : BITOFF;
          e.style.color = w.col;               /* currentColor glow */
          e.classList.toggle('on', !!on);
        }
      }
      /* 'tot' ОБЪЁМ мигрировал в 'par' — отдельной обработки нет */
      /* 'bar' БАРГРАФ: заполнение = значение / уставка режима (100%) */
      for (const w of widgets || []) {
        if (w.t !== 'bar' || !w.on) continue;
        const m = BARM[w.mode], f = $('hf_' + w.k);
        const v = m ? d[m.src] : undefined;
        if (f && v !== undefined) {
          /* 100% = the setpoint parameter of the mode (paramsTick);
           * fallback until it is known: running min/max like the chart */
          let hi = SP[w.mode];
          if (!(hi > 0)) {
            if (!(w.k in barLo) || v < barLo[w.k]) barLo[w.k] = v;
            if (!(w.k in barHi) || v > barHi[w.k]) barHi[w.k] = v;
            hi = barHi[w.k];
            if (hi - (barLo[w.k] || 0) < 1e-9) hi = (barLo[w.k] || 0) + 1;
          }
          const pct = Math.max(0, Math.min(100, v / hi * 100));
          f.style.width = pct.toFixed(1) + '%';
          const t = $('bp_' + w.k);
          if (t) t.textContent = pct.toFixed(0) + '%';
        }
      }
    }
    async function valuesTick() {
      try {
        const d = await (await fetch('/api/values')).json();
        if (d.link !== undefined) {
          $('link').textContent = d.link ? 'ONLINE' : 'OFFLINE';
          $('link').className = 'tag ' + (d.link ? 'ok' : 'bad');
        }
        if (!d.ok) { return }
        if (!vBuilt) vBuild();
        vApply(d);
        /* every enabled chart widget appends its own source value */
        for (const w of widgets || [])
          if (w.t === 'chart' && w.on && CHSRC[w.src]) {
            const v = d[CHSRC[w.src].src];
            if (v !== undefined) { chartPush(w.k, v, CHPER[w.per] ? w.per : 600); chartDraw(w) }
          }
      } catch (e) { }
    }
    setInterval(valuesTick, 200); valuesTick();
    /* отладочная информация (fw/ip/rssi/uptime/heap) переехала на /panel */
    paramsTick(); setInterval(paramsTick, 30000);
    wSync();
    /* /panel открывает режимы правки ссылками с query-параметрами */
    if (location.search.includes('edit')) toggleEdit();
  </script>
</body>

</html>
