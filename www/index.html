<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SKE-02 Gateway</title>
  <style>
    /* ==================================================================
     * STYLE MAP (index.html - главная страница мониторинга)
     *   1. общие: body, header, h1, .tag/.ok/.bad, button, #debug
     *   2. сетка виджетов: #values, .vcard (+ .wbar/.wbit/.chart/.wide),
     *      .vname (подпись), .vval (число)
     *   3. режим правки раскладки: body.edit*, #btnEdit.act
     *   4. виджет БАРГРАФ (.vcard.wbar): .hbar (дорожка), .hfill
     *      (рваная заливка), .bpct (проценты)
     *   6. виджет БИТ (.vcard.wbit): .bitlamp (лампа)
     * ================================================================== */

    /* --- 1. общие ---------------------------------------------------- */

    body {
      font: 13px/1.45 system-ui, sans-serif;
      /* background: #14171c; */
      background: #000000;
      /* цвет фона всей страницы */
      color: #ffffff;
      /* основной цвет текста */
      margin: 0;
      padding: 4px
        /* внешний отступ страницы */
    }

    /* шапка: заголовок, метка связи, шестерёнка справа */
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
      margin-bottom: 5px
    }

    /* шестерёнка без надписи, прижата вправо; открывает /panel */
    .gear {
      margin-left: auto;
      font-size: 22px;
      line-height: 1;
      color: #d8dee9;
      text-decoration: none;
      padding: 2px 3px;
      border-radius: 4px
    }

    .gear:hover {
      background: #2a3140
    }

    /* режим закрепления: зелёный якорь */
    .gear.ok {
      color: #d8dee9;
      font-size: 18px
    }

    h1 {
      font-size: 18px;
      /* размер заголовка "SKE-02 Gateway" */
      margin: 0 4px 0 0
    }

    /* маленькая метка-пилюля в шапке (UART: связь, fw, ip...) */
    .tag {
      background: #2a3140;
      /* фон метки */
      border-radius: 4px;
      padding: 2px 4px;
      font-size: 12px;
      white-space: nowrap
    }

    .ok {
      background: #1d5c2f
    }

    /* метка связи: зелёный (связь есть) */
    .bad {
      background: #6c2431
    }

    /* метка связи: красный (нет связи) */

    /* все обычные кнопки */
    button {
      background: #19284d;
      /* синий фон кнопки */
      color: #fff;
      border: 0;
      border-radius: 4px;
      padding: 4px 4px;
      /* паддинг кнопки (верт гориз) */
      cursor: pointer;
      font-size: 12px
    }

    button.warn {
      background: #7d3127
    }

    /* красная кнопка (Перезагрузить, удалить) */

    /* отладочная панель внизу (ip/rssi/uptime/heap) */
    #debug {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin: 0 0 4px 0;
      padding: 4px 4px;
      border: 1px dashed #39414f;
      border-radius: 4px;
      color: #8b94a7;
      font-size: 12px
    }

    #debug .tag {
      background: transparent;
      border: 1px solid #2a3140;
      padding: 1px 3px
    }

    #debug button {
      font-size: 12px;
      padding: 4px 4px
    }

    /* --- 2. сетка виджетов ------------------------------------------- */

    /* контейнер всех карточек-виджетов (#values в body) */
    #values {
      display: grid;
      /* half-width tracks: a normal card spans 2 tracks (a full cell,
       * 10 chars of 15px monospace), a bit card spans 1 -> two bits
       * pack into one value-card slot */
      grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
      gap: 6px;
      /* расстояние между карточками */
      margin: 0 0 10px 0
    }

    /* --- МОБИЛЬНАЯ ВЕРСИЯ (узкий экран): сетка фиксировано 4 трека
     *   параметр/значение  span 2 -> не более ДВУХ в ряд
     *   барграф            span 4 -> не более ОДНОГО в ряд
     *   бит                span 1 -> не более ЧЕТЫРЁХ в ряд
     *   график             1/-1   -> один на всю ширину (как и было) */
    /*
     * МОБИЛЬНЫЙ ВАРИАНТ: узкий экран ИЛИ тач-устройство без мыши
     * (pointer: coarse - планшет/телефон в альбомной ориентации тоже
     * широкий, но им нужен тот же компактный лайоут).
     * Ширины виджетов:
     *   барграф и график - весь экран
     *   параметр и ввод  - 1/2 экрана
     *   кнопка и индикатор - 1/4 экрана
     */
    @media (max-width: 640px),
    (pointer: coarse) and (hover: none) {
      #values {
        grid-template-columns: repeat(4, minmax(0, 1fr))
      }

      /* специфичность выше базовых правил (#values), иначе каскад
         побеждает более поздний .vcard.winp{span 4} */

      /* параметр, ввод и значение - половина экрана */
      #values .vcard,
      #values .vcard.winp {
        grid-column: auto / span 2
      }

      /* индикатор и кнопка - четверть экрана */
      #values .vcard.wbit,
      #values .vcard.wbtn {
        grid-column: auto / span 1
      }

      /* барграф и график - весь экран */
      #values .vcard.wbar,
      #values .vcard.chart {
        grid-column: 1 / -1
      }
    }

    /* обычная карточка занимают полный слот */
    .vcard {
      grid-column: span 2
    }

    /* карточка барграфа занимают 2 слот */
    .vcard.wbar {
      grid-column: span 4
    }

    /* карточка виджета общего вида (значение, расход, объём...) */
    .vcard {
      background: #1b202a;
      /* фон карточки */
      border: 2px solid #2a3140;
      /* рамка карточки */
      border-radius: 4px;
      padding: 2px 4px;
      /* vertical horizontal */
      height: 50px;
      box-sizing: border-box;
      overflow: hidden
        /* единая высота ВСЕХ карточек, кроме графика */
    }

    /* подпись (имя параметра) внутри карточки */
    .vname {
      color: #ffffff;
      /* серый цвет подписи */
      font-size: 12px
        /* размер шрифта подписи */
    }

    /* числовое значение внутри карточки */
    .vval {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 20px;
      /* размер цифр значения */
      white-space: nowrap
    }

    .vcard.wide {
      grid-column: span 4
    }

    /* широкая карточка (2 слота) */

    /* карточка графика расхода - на всю ширину строки */
    .vcard.chart {
      grid-column: 1/-1
    }

    /* canvas самого графика внутри карточки */
    /* график: высота от canvas (3x барграф), НЕ фиксированные 44px */
    .vcard.chart {
      height: auto;
      overflow: visible;
      grid-column: 1/-1
    }

    .vcard.chart canvas {
      width: 100%;
      height: 114px;
      /* карточка графика = 3 высоты карточки барграфа (46*3=138) */
      display: block
    }

    /* --- 3. режим правки раскладки ("✎ Раскладка" включает body.edit) - */

    #btnEdit.act {
      background: #1d5c2f
    }

    /* кнопка Раскладка в активном режиме */

    body.edit .vcard {
      outline: 2px dashed #6a5a1f;
      /* перетаскиваемая карточка: пунктир */
      cursor: grab;
      /* мобильный вариант: без этого жест уходит в нативный скролл */
      touch-action: none;
      -webkit-touch-callout: none
    }

    body.edit .vcard.dragging {
      /* карточка в момент перетаскивания */
      opacity: .35;
      cursor: grabbing
    }

    body.edit #values {
      user-select: none
    }

    /* не выделять текст при драге */

    /* --- 4. виджет БАРГРАФ (t:'bar', .vcard.wbar) --------------------- */

    /* дорожка барграфа: тёмный фон, заливка едет внутри */
    .hbar {
      position: relative;
      /* контейнер для процента (.bpct) */
      background: #0e1116;
      /* цвет пустой дорожки */
      border: 1px solid #39414f;
      border-radius: 2px;
      height: 20px;
      /* высота дорожки (в карточке ниже - 16) */
      margin-top: 6px;
      overflow: hidden
    }

    /* torn stripe fill: solid dashes with gaps */
    .hfill {
      height: 100%;
      width: 0;
      transition: width .20s ease-out;
      /* плавность движения заливки */
      /* green torn stripe: wide dashes, hairline gaps */
      background: repeating-linear-gradient(90deg, #3f5dbf 0 10px, transparent 10px 12px)
        /* штрих 8px, зазор 2px */
        /* цвет штриха */
    }

    /* bar card: label + the stripe, 3px horizontal padding */
    .vcard.wbar {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 3px
    }

    /* дорожка внутри карточки барграфа - чуть выше */
    .vcard.wbar .hbar {
      height: 20px;
      margin-top: 0
    }

    /* percent readout, right-aligned in the bar label line */
    /* процент ВНУТРИ полоски, по центру, поверх заливки */
    .bpct {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 15px;
      line-height: 1;
      font-family: ui-monospace, Consolas, monospace;
      text-shadow: 0 0 3px #000, 0 0 3px #000
        /* читаемость поверх штрихов */
    }

    /* строка значения виджета "Параметр": число + единицы прижаты вправо */
    .vrow {
      display: flex;
      justify-content: flex-end;
      align-items: baseline;
      gap: 4px
    }

    .vunit {
      color: #8b94a7;
      /* единицы мельче и тусклее числа */
      font-size: 11px;
      white-space: nowrap
    }

    /* уставка-100% прогрессбара: прижата вправо в строке имени */
    .bsub {
      float: right;
      color: #8b94a7;
      font-size: 11px;
      white-space: nowrap
    }

    /* единицы измерения виджетов "Параметр"/"Ввод": всегда справа ВВЕРХУ
     * карточки, в строке имени */
    .utop {
      float: right;
      color: #8b94a7;
      font-size: 11px;
      white-space: nowrap
    }

    /* --- 5. виджет БИТ (t:'bit', .vcard.wbit) ------------------------- */

    /* bit-state card: HALF a value-cell wide (span 1 of the 2-track
     * cell) and compact, so two of them pack into one slot; the label
     * wraps on spaces, the lamp takes the chosen active color */
    .vcard.wbit {
      grid-column: span 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 2px;
      padding: 3px 4px
        /* высота наследует общий min-height карточек */
    }

    /* подпись карточки бита: мелкая, переносится по пробелам */
    .vcard.wbit .vname {
      white-space: normal;
      font-size: 12px;
      line-height: 1.15;
      color: #ffffff;
      overflow: hidden
    }

    /* лампа состояния бита (цвет активного уровня задаёт виджет) */
    .bitlamp {
      height: 20px;
      /* высота лампы */
      border: 1px solid #39414f;
      border-radius: 6px;
      background: #0e1116;
      /* inactive level - keep in sync with BITOFF */
      transition: background .15s
        /* плавность включения */
    }

    /* включённая лампа слегка светится (цвет = w.col виджета) */
    .bitlamp.on {
      box-shadow: 0 0 6px 0 currentColor
    }

    /* --- 6. виджет КНОПКА (.vcard.wbtn) ------------------------------ */
    /* размер и паддинги - как у индикатора (.vcard.wbit): span 1,
     * flex-колонка, gap 2, padding 3px 4px, min-height 28; подпись
     * кнопки стоит в теле, цвет фона задаёт вид (СТОП/СТАРТ/ПАУЗА/СБРОС) */
    .vcard.wbtn {
      grid-column: span 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      padding: 3px 4px;
      height: 50px;
      box-sizing: border-box;
      align-items: center;
      text-align: center;
      cursor: pointer;
      user-select: none;
      font-weight: 650;
      font-size: 18px;
      color: #BBB;
    }

    .vcard.wbtn:active {
      filter: brightness(1.3)
        /* отклик на нажатие */
    }

    /* --- 7. виджет ВВОД УСТАВКИ (.vcard.winp) ------------------------ */
    /* размеры и паддинги как у барграфа: полный слот, число справа */
    .vcard.winp {
      grid-column: span 4;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 3px;
      box-sizing: border-box;
      height: 50px;
      justify-content: space-between
    }

    .vcard.winp input {
      background: #0e1116;
      color: #d8dee9;
      border: 1px solid #39414f;
      border-radius: 4px;
      padding: 4px 3px;
      font: 17px ui-monospace, Consolas, monospace;
      text-align: right;
      width: 100%;
      /* поле на всю ширину карточки */
      box-sizing: border-box
    }
  </style>
</head>

<body>
  <header>
    <h1>SKE-02 Gateway</h1>
    <span id="link" class="tag">…</span>
    <!-- шестерёнка справа вверху: страница панели (раскладка/виджеты/
         Wi-Fi/перезагрузка/прибор/профили); отладочная панель теперь там -->
    <a href="#" class="gear" id="gear" onclick="gearClick();return false" title="Панель">&#9881;</a>
  </header>
  <div id="values"></div>
  <!-- панели редактирования всё ещё живут здесь (режим правки и
       «Виджеты» открываются с /panel через /?edit=1 и /?widgets=1) -->
  <button id="btnEdit" onclick="toggleEdit()" hidden>&#9998; Раскладка</button>
  <script src="/shared.js"></script>
  <script src="/index.js"></script>
</body>

</html>
