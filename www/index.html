<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SKE-02 Gateway</title>
  <style>
    /* ==================================================================
     * STYLE MAP (index.html - главная страница мониторинга)
     *   1. общие: body, header, h1, .tag/.ok/.bad, button, #debug
     *   2. сетка виджетов: #values, .vcard (+ .wbar/.wbit/.chart/.wide),
     *      .vname (подпись), .vval (число)
     *   3. режим правки раскладки: body.edit*, #btnEdit.act
     *   4. панель "Виджеты": #wpanel*, #btnW.act, .flash
     *   5. виджет БАРГРАФ (.vcard.wbar): .hbar (дорожка), .hfill
     *      (рваная заливка), .bpct (проценты)
     *   6. виджет БИТ (.vcard.wbit): .bitlamp (лампа)
     * ================================================================== */

    /* --- 1. общие ---------------------------------------------------- */

    body {
      font: 13px/1.45 system-ui, sans-serif;
      /* background: #14171c; */
      background: #000000;
      /* цвет фона всей страницы */
      color: #ffffff;
      /* основной цвет текста */
      margin: 0;
      padding: 12px
        /* внешний отступ страницы */
    }

    /* шапка: заголовок, метки связи, кнопки (Раскладка/Виджеты/...) */
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px
    }

    h1 {
      font-size: 18px;
      /* размер заголовка "SKE-02 Gateway" */
      margin: 0 8px 0 0
    }

    /* маленькая метка-пилюля в шапке (UART: связь, fw, ip...) */
    .tag {
      background: #2a3140;
      /* фон метки */
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 12px;
      white-space: nowrap
    }

    .ok {
      background: #1d5c2f
    }

    /* метка связи: зелёный (связь есть) */
    .bad {
      background: #6c2431
    }

    /* метка связи: красный (нет связи) */

    /* все обычные кнопки */
    button {
      background: #1e3264;
      /* синий фон кнопки */
      color: #fff;
      border: 0;
      border-radius: 4px;
      padding: 5px 5px;
      /* паддинг кнопки (верт гориз) */
      cursor: pointer;
      font-size: 12px
    }

    button.warn {
      background: #7d3127
    }

    /* красная кнопка (Перезагрузить, удалить) */

    /* отладочная панель внизу (ip/rssi/uptime/heap) */
    #debug {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin: 0 0 8px 0;
      padding: 4px 8px;
      border: 1px dashed #39414f;
      border-radius: 4px;
      color: #8b94a7;
      font-size: 12px
    }

    #debug .tag {
      background: transparent;
      border: 1px solid #2a3140;
      padding: 1px 6px
    }

    #debug button {
      font-size: 12px;
      padding: 4px 4px
    }

    /* --- 2. сетка виджетов ------------------------------------------- */

    /* контейнер всех карточек-виджетов (#values в body) */
    #values {
      display: grid;
      /* half-width tracks: a normal card spans 2 tracks (a full cell,
       * 10 chars of 15px monospace), a bit card spans 1 -> two bits
       * pack into one value-card slot */
      grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
      gap: 6px;
      /* расстояние между карточками */
      margin: 0 0 10px 0
    }

    /* --- МОБИЛЬНАЯ ВЕРСИЯ (узкий экран): сетка фиксировано 4 трека
     *   параметр/значение  span 2 -> не более ДВУХ в ряд
     *   барграф            span 4 -> не более ОДНОГО в ряд
     *   бит                span 1 -> не более ЧЕТЫРЁХ в ряд
     *   график             1/-1   -> один на всю ширину (как и было) */
    @media (max-width: 640px) {
      #values {
        grid-template-columns: repeat(4, minmax(0, 1fr))
      }

      .vcard {
        grid-column: auto / span 2
      }

      .vcard.wbit {
        grid-column: auto / span 1
      }
    }

    /* обычная карточка занимают полный слот */
    .vcard {
      grid-column: span 2
    }

    /* карточка барграфа занимают 2 слот */
    .vcard.wbar {
      grid-column: span 4
    }

    /* карточка виджета общего вида (значение, расход, объём...) */
    .vcard {
      background: #1b202a;
      /* фон карточки */
      border: 2px solid #2a3140;
      /* рамка карточки */
      border-radius: 4px;
      padding: 2px 4px
        /* vertical horizontal */
    }

    /* подпись (имя параметра) внутри карточки */
    .vname {
      color: #ffffff;
      /* серый цвет подписи */
      font-size: 11px
        /* размер шрифта подписи */
    }

    /* числовое значение внутри карточки */
    .vval {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 16px;
      /* размер цифр значения */
      white-space: nowrap
    }

    .vcard.wide {
      grid-column: span 4
    }

    /* широкая карточка (2 слота) */

    /* карточка графика расхода - на всю ширину строки */
    .vcard.chart {
      grid-column: 1/-1
    }

    /* canvas самого графика внутри карточки */
    .vcard.chart canvas {
      width: 100%;
      height: 120px;
      /* высота графика */
      display: block
    }

    /* --- 3. режим правки раскладки ("✎ Раскладка" включает body.edit) - */

    #btnEdit.act {
      background: #1d5c2f
    }

    /* кнопка Раскладка в активном режиме */

    body.edit .vcard {
      outline: 1px dashed #39414f;
      /* перетаскиваемая карточка: пунктир */
      cursor: grab
    }

    body.edit .vcard.dragging {
      /* карточка в момент перетаскивания */
      opacity: .35;
      cursor: grabbing
    }

    body.edit #values {
      user-select: none
    }

    /* не выделять текст при драге */

    /* --- 4. панель "Виджеты" ----------------------------------------- */

    #btnW.act {
      background: #1d5c2f
    }

    /* кнопка Виджеты в активном режиме */

    /* панель конфигурации виджетов (список + кнопка Сохранить) */
    #wpanel {
      background: #1b202a;
      /* фон панели */
      border: 1px solid #2a3140;
      border-radius: 4px;
      padding: 10px 12px;
      margin: 0 0 10px 0;
      display: flex;
      flex-direction: column;
      gap: 6px
        /* расстояние между строками панели */
    }

    #wpanel[hidden] {
      display: none
    }

    /* выключенный атрибут hidden сильнее display:flex */

    /* строка панели: чекбокс+имя виджета, комбобоксы, кнопки */
    /* строка панели ДВУХСТРОЧНАЯ: сверху имя (и удаление), снизу
     * элементы управления - чтобы ничего не "уезжало" вбок */
    #wpanel .wrow {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: #141821;
      border: 1px solid #232a38;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 13px
    }

    #wpanel .r1,
    #wpanel .r2 {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center
    }

    #wpanel .r1 label,
    #wpanel .r1 span {
      flex: 1
        /* имя растягивается, кнопка (удалить/добавить) вправо */
    }

    /* заголовки секций панели: "Добавление" и "Виджеты" */
    #wpanel .wsec {
      color: #8b94a7;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-top: 6px
    }

    /* тёмная тема нативных контролов панели: color-scheme красит
     * чекбоксы/пикингеры/выпадашки, select стилизуем вручную */
    :root {
      color-scheme: dark
    }

    #wpanel select,
    #wpanel input[type=number] {
      background: #0e1116;
      color: #d8dee9;
      border: 1px solid #39414f;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 13px
    }

    #wpanel select:disabled {
      color: #565f6e;
      /* заблокированное - тусклее */
      background: #141821
    }

    /* поля min/max в строке виджета */
    #wpanel input[type=number] {
      width: 80px
    }

    /* служебные сообщения панели ("не сохранено") */
    .flash {
      color: #7aa2f7;
      font-size: 12px
    }

    /* --- 5. виджет БАРГРАФ (t:'bar', .vcard.wbar) --------------------- */

    /* дорожка барграфа: тёмный фон, заливка едет внутри */
    .hbar {
      background: #0e1116;
      /* цвет пустой дорожки */
      border: 1px solid #39414f;
      border-radius: 2px;
      height: 14px;
      /* высота дорожки (в карточке ниже - 16) */
      margin-top: 6px;
      overflow: hidden
    }

    /* torn stripe fill: solid dashes with gaps */
    .hfill {
      height: 100%;
      width: 0;
      transition: width .25s ease-out;
      /* плавность движения заливки */
      /* green torn stripe: wide dashes, hairline gaps */
      background: repeating-linear-gradient(90deg, #3fbf5f 0 10px, transparent 10px 11px)
        /* цвет штриха */
    }

    /* bar card: label + the stripe, 3px horizontal padding */
    .vcard.wbar {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 3px
    }

    /* дорожка внутри карточки барграфа - чуть выше */
    .vcard.wbar .hbar {
      height: 16px;
      margin-top: 0
    }

    /* percent readout, right-aligned in the bar label line */
    .bpct {
      float: right;
      color: #ffffff;
      font-size: 12px;
      font-family: ui-monospace, Consolas, monospace
    }

    /* --- 6. виджет БИТ (t:'bit', .vcard.wbit) ------------------------- */

    /* bit-state card: HALF a value-cell wide (span 1 of the 2-track
     * cell) and compact, so two of them pack into one slot; the label
     * wraps on spaces, the lamp takes the chosen active color */
    .vcard.wbit {
      grid-column: span 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 2px;
      padding: 3px 4px;
      min-height: 28px
        /* минимальная высота карточки бита */
    }

    /* подпись карточки бита: мелкая, переносится по пробелам */
    .vcard.wbit .vname {
      white-space: normal;
      font-size: 10px;
      line-height: 1.15;
      color: #ffffff;
      overflow: hidden
    }

    /* лампа состояния бита (цвет активного уровня задаёт виджет) */
    .bitlamp {
      height: 16px;
      /* высота лампы */
      border: 1px solid #39414f;
      border-radius: 6px;
      background: #0e1116;
      /* inactive level - keep in sync with BITOFF */
      transition: background .15s
        /* плавность включения */
    }

    /* включённая лампа слегка светится (цвет = w.col виджета) */
    .bitlamp.on {
      box-shadow: 0 0 6px 0 currentColor
    }

    /* --- 7. виджет КНОПКА (.vcard.wbtn) ------------------------------ */
    /* квадрат шириной с индикатор (высота = ширине), подпись в теле;
     * цвет фона задаётся видом кнопки (СТОП/СТАРТ/ПАУЗА/СБРОС) */
    .vcard.wbtn {
      grid-column: span 1;
      box-sizing: border-box;
      /* aspect-ratio считает с рамкой */
      aspect-ratio: 1 / 1;
      /* высота = ширине */
      align-self: start;
      /* иначе grid растянет по высоте ряда */
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      user-select: none;
      font-weight: 600;
      font-size: 12px;
      color: #fff;
      padding: 3px 5px
    }

    .vcard.wbtn:active {
      filter: brightness(1.3)
        /* отклик на нажатие */
    }

    /* --- 8. виджет ВВОД УСТАВКИ (.vcard.winp) ------------------------ */
    /* размеры и паддинги как у барграфа: полный слот, число справа */
    .vcard.winp {
      grid-column: span 4;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 3px
    }

    .vcard.winp input {
      background: #0e1116;
      color: #d8dee9;
      border: 1px solid #39414f;
      border-radius: 4px;
      padding: 4px 6px;
      font: 14px ui-monospace, Consolas, monospace;
      text-align: right
    }
  </style>
</head>

<body>
  <header>
    <h1>SKE-02 Gateway</h1>
    <span id="link" class="tag">…</span>
  </header>
  <div id="wpanel" hidden>
    <div id="wlist"></div>
  </div>
  <div id="values"></div>
  <div id="debug">
    отладочная панель
    <button onclick="rescan()">Пересканировать</button>

    <span id="fw" class="tag"></span>
    <span class="tag" id="ip"></span><span class="tag" id="rss"></span>
    <span class="tag" id="upt"></span><span class="tag" id="heap"></span>

    <button id="btnEdit" onclick="toggleEdit()">&#9998; Раскладка</button>
    <button id="btnW" onclick="toggleW()">&#9633; Виджеты</button>
    <a href="/settings"><button>&#9881; Настройки</button></a>
    <button class="warn" onclick="rebootDev()">Перезагрузить прибор</button>
    <a href="/wifi"><button>Wi-Fi</button></a>
  </div>
  <script>
    const $ = i => document.getElementById(i);
    function hms(t) { const s = t % 60, m = (t / 60 | 0) % 60, h = t / 3600 | 0; return h ? h + 'ч ' + m + 'м' : m ? m + 'м ' + s + 'с' : s + 'с' }
    /* live values window: MeterData_t fields, names as the struct members;
     * bitwise members render as FSETPOINT_/FSTATUS_/FISR_ flag chips */
    const FLAGS = {
      setpoint: ['RATEQMAX', 'RATEHIGH', 'RATELOW', 'FLOW', 'TOTAL', 'GTOTAL', 'BATCH', 'PREEMPTION'],
      status: ['ACCESERROR', 'BATCHER_TIMEOUT', 'BATCHER_PAUSE', 'BATCHER_FINISH', 'RTCERROR', 'RAMERROR', 'REVERSE', 'LOGFULL'],
      isr: ['DOUT0', 'DOUT1', 'DOUT2', 'BUZZER', 'HIGHFREQ', 'LOWFREQ', 'DUTY', 'PHASE']
    };
    /* display labels for the flag chips (bit order must match FLAGS) */
    const FLBL = {
      RATEQMAX: 'Расх>Qмакс', RATEHIGH: 'Расх>макс', RATELOW: 'Расх<мин',
      FLOW: 'Поток', TOTAL: 'Объём', GTOTAL: 'Общий объём', BATCH: 'Порция',
      PREEMPTION: 'Прерывание',
      ACCESERROR: 'Ошибка доступа', BATCHER_TIMEOUT: 'Таймаут порции',
      BATCHER_PAUSE: 'Порция: пауза', BATCHER_FINISH: 'Порция: конец',
      RTCERROR: 'Ошибка RTC', RAMERROR: 'Ошибка RAM', REVERSE: 'Реверс',
      LOGFULL: 'Журнал полон',
      DOUT0: 'Вых0', DOUT1: 'Вых1', DOUT2: 'Вых2', BUZZER: 'Звук',
      HIGHFREQ: 'Частота>', LOWFREQ: 'Частота<', DUTY: 'Скважность', PHASE: 'Фаза'
    };
    // const VFLOATS = ['frequency', 'rate_raw', 'rate_fast', 'rateMLPM', 'rate', 'total_plus', 'total_minus', 'total', 'total_sum', 'totalml_plus', 'totalml_minus', 'gtotal', 'gtotalml', 'kf_value', 'batch'];
    const VFLOATS = ['kf_value', 'batch'];
    const VUINTS = ['pulses_packet', 'pulses'];
    /* display labels only: the JSON keys stay the MeterData_t member
     * names, so the 'm' data itself is untouched */
    const LBL = {
      frequency: 'Частота, Гц',
      rate_raw: 'Расход (raw)',
      rate_fast: 'Расход (fast)',
      rateMLPM: 'Расход, мл/мин',
      rate: 'Расход',
      total_plus: 'Объём +',
      total_minus: 'Объём −',
      total: 'Объём',
      total_sum: 'Объём (сумма)',
      totalml_plus: 'Объём +, мл',
      totalml_minus: 'Объём −, мл',
      gtotal: 'Общий объём',
      gtotalml: 'Общий объём, мл',
      kf_value: 'K-фактор',
      batch: 'Порция',
      pulses_packet: 'Импульсы (пакет)',
      pulses: 'Импульсы',
      setpoint: 'Уставки (биты)',
      status: 'Состояние (биты)',
      isr: 'Флаги ISR (биты)'
    };

    const prec7 = x => Number(x.toPrecision(7));
    const round2 = x => Number(x.toFixed(2));
    /*
     * ── CUSTOM VALUE WIDGETS ────────────────────────────────────────
     * A digital-parameter widget computed by a free-form formula:
     *   calc(d, C) - d = the whole live 'm' values object (fields are
     *   the names in VFLOATS/VUINTS above), C = the named constants
     *   from MY_CONST below. Returns a number.
     * To add your own widget by hand, add ONE line to CUSTOM, e.g.:
     *     total_x2: { calc: (d, C) => d.total * C.k, label: 'Объём ×k', on: true },
     * That's all: the widget auto-appears on the main screen and in
     * the "Виджеты" panel (a saved layout already in localStorage
     * picks the new entry up on the next page load).
     * 'on' is the initial state for a FIRST appearance only; later
     * on/off and drag order are the user's, kept in localStorage.
     */
    const MY_CONST = {
      my_const: 10
    };
    const CUSTOM = {
      // fast_plus_total: { calc: d => r7(d.rate_fast + 10) + d.total, label: 'Частота, Гц', on: true },
      frequency_hz: { calc: d => round2(d.frequency), label: 'Частота, Гц', on: true },
      k_factor: { calc: d => prec7(d.kf_value), label: 'К-фактор', on: true },
      imp_weight: { calc: d => prec7(d.kf_value), label: 'Цена имп', on: true },
    };
    /*
     * ── FLOW WIDGET ─────────────────────────────────────────────────
     * Configurable rate widget (like the bar, configured in the panel):
     * input is rateMLPM (ml/min), the two combos pick the volume unit
     * and the time unit; the label composes itself ("Расход, л/мин").
     * The "vol" widget below is the same for gtotal (volume only).
     */
    const VOLU = { ml: 1, l: 1000, m3: 1000000 };   /* ml per volume unit */
    const VOLN = { ml: 'мл', l: 'л', m3: 'м³' };
    const PSEC = { s: 1, m: 60, h: 3600 };          /* seconds per period */
    const PERN = { s: 'с', m: 'мин', h: 'ч' };
    /*
     * ── BAR WIDGET MODES ────────────────────────────────────────────
     * value source + the setpoint parameter that marks the 100% level
     * (resolved by name from /api/params, see paramsTick)
     */
    const BARM = {
      qmax: { n: 'Расход (Qmax)', src: 'rate', sp: 'Qmax,л', un: 'rate' },
      rate: { n: 'Расход', src: 'rate', sp: 'Расход+', un: 'rate' },
      total: { n: 'Объём', src: 'total', sp: 'Объём', un: 'obj' },
      gtotal: { n: 'Общий', src: 'gtotal', sp: 'Общий', un: 'ob' },
      dose: { n: 'Доза', src: 'batch', sp: 'Доза', un: 'obj' }
    };
    let SP = {};   /* mode -> setpoint 100% value, refreshed with the tree */
    /*
     * Measurement units from the device tree (Основные → Единицы
     * измерения): three enum params "Расход"/"Объём"/"Общий" with
     * Миллилитр|Литр|Метр куб. Values AND setpoints arrive already in
     * these units (the device converts both), so the bar only needs
     * the right label - no conversion on our side.
     */
    const UNSHORT = { 'Миллилитр': 'мл', 'Литр': 'л', 'Метр куб.': 'м³' };
    const PERSHORT = { 'Секунда': 'с', 'Минута': 'мин', 'Час': 'ч' };
    let UN = { rate: '', obj: '', ob: '', time: '' };
    /*
     * ── MULTIPLIER WIDGET (t:'mul') ────────────────────────────────
     * The meter's multiplier (Измеритель → Множитель): param 000 "Тип"
     * picks K-фактор|Цена имп, param 002 "Значение" is the number in
     * THAT type. "авто" = follow the device type; a manual mode shows
     * the reciprocal (1/v) when it differs from the device type.
     */
    const MULM = { kf: 'К-фактор', price: 'Цена имп' };
    let MULT = { type: 'price', value: NaN };   /* from the params tree */
    let MULU = '';    /* объёмная единица множителя (меню Множитель → Единицы) */
    /*
     * ── PARAM WIDGET (t:'par') ─────────────────────────────────────
     * Replaces the old flow/vol/tot trio. One source combo (from CHSRC:
     * Расход, Объём/+/−/#, Общий, Доза), unit combos (period is enabled
     * for Расход only) and the "авто" checkbox: checked = show the value
     * as the device reports it (device units from UN); unchecked =
     * convert to the manually chosen units. Raw 'm' values come in the
     * DEVICE units, so conversion = volume ratio (+ period ratio for
     * rate: seconds of the device period / seconds of the target one).
     */
    /* device-unit short name -> our combo key (мл->ml, мин->m, ...) */
    const UNKEY = { 'мл': 'ml', 'л': 'l', 'м³': 'm3', 'с': 's', 'мин': 'm', 'ч': 'h' };

    /* vApply: раз в кадр 'm' обновляет карточки всех типов виджетов */
    function vApply(d) {
      const barLo = vApply.lo || (vApply.lo = {}), barHi = vApply.hi || (vApply.hi = {});
      for (const n of VFLOATS) { const e = $('vf_' + n); if (e && d[n] !== undefined) e.textContent = d[n] }
      for (const n of VUINTS) { const e = $('vf_' + n); if (e && d[n] !== undefined) e.textContent = d[n] }
      /* 'cval' КАСТОМНЫЕ: формула calc(d, MY_CONST) из блока CUSTOM */
      for (const w of widgets || []) {

      for (const w of widgets || []) {

        const e = $('vp_' + w.k), v = parValue(w, d);
        if (e && v !== undefined && isFinite(v))
          e.textContent = Number(v.toPrecision(4))
      }

      for (const w of widgets || []) {
        if (w.t !== 'bit' || !w.on) continue;

          /* units: enums in "Основные → Единицы измерения" (Расход/Объём/
           * Общий + Период: за какое время считается расход) */
          if (p.t === 11 && p.tb === 'Единицы измерения') {
            if (p.n === 'Расход') un.rate = UNSHORT[p.v] || '';
            if (p.n === 'Объём') un.obj = UNSHORT[p.v] || '';

        }
        if (mult.type !== MULT.type || mult.value !== MULT.value || mulU !== MULU) {
          MULT = mult;
          MULU = mulU;
          vBuild();               /* relabel the multiplier widgets */
        }
        if (un.rate !== UN.rate || un.obj !== UN.obj || un.ob !== UN.ob ||
          un.time !== UN.time) {
          UN = un;
          /* авто-параметры зеркалят новые единицы прибора */
          for (const w of widgets) parSyncAuto(w);
          vBuild();               /* relabel the bars with the new units */
        }
        /* кнопки и уставки дозатора: перерисовать при изменении */
        const inpChanged = Object.keys(INP).length !== Object.keys(inp).length ||
          Object.keys(inp).some(s => INP[s] && inp[s] && (INP[s].id !== inp[s].id || INP[s].v !== inp[s].v));
        if (btnp.mode !== BTNP.mode || btnp.reset !== BTNP.reset) BTNP = btnp;
        if (inpChanged) { INP = inp; vBuild() }
      } catch (e) { }
    }
    paramsTick(); setInterval(paramsTick, 30000);
    wSync();
    async function rescan() { await fetch('/api/rescan', { method: 'POST' }); infoTick(); paramsTick() }
    function rebootDev() { if (confirm('Перезагрузить прибор?')) fetch('/api/reboot', { method: 'POST' }) }
    infoTick(); setInterval(infoTick, 5000);
  </script>
</body>

</html>
