<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
    /* пароли БЕЗ type="password": браузеры не предлагают сохранение.
     * Маскируем точками силами CSS (Chrome/Safari/Android WebView) */
    .pwmask { -webkit-text-security: disc; }
        /* --- 1. общие ---------------------------------------------------- */
        body {
            font: 14px/1.45 system-ui, sans-serif;
            background: #000000;
            /* цвет фона страницы (как на главной) */
            color: #d8dee9;
            margin: 0;
            padding: 4px
        }

        header {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-bottom: 10px
        }

        h1 {
            font-size: 18px;
            margin: 0 8px 0 0
        }

        button {
            background: #21366c;
            /* синяя кнопка */
            color: #fff;
            border: 0;
            border-radius: 4px;
            padding: 3px 5px;
            cursor: pointer;
            font-size: 13px
        }

        input {
            width: 100%;
            box-sizing: border-box;
            background: #0e1116;
            color: #d8dee9;
            border: 1px solid #39414f;
            border-radius: 4px;
            /* единый размер контролов: 25px высота, 13px шрифт */
            padding: 2px 4px;
            font-size: 13px
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 6px
        }

        td {
            padding: 3px 5px;
            border-top: 1px solid #2a3140
        }

        /* уровень сигнала и замок - по центру своих колонок */
        td:nth-child(2),
        td:nth-child(3) {
            text-align: center
        }

        /* ячейка кнопки - минимальная (по содержимому): тянется ПЕРВАЯ
 * колонка с именем сети, а уровень/замок/кнопка_packаются вправо */
        td:first-child {
            width: 100%
        }

        /* последняя ячейка строки (кнопка «Выбрать») - прижата вправо */
        td:last-child {
            text-align: right
        }

        .pick {
            background: #233047;
            color: #d8dee9;
            border: 1px solid #39414f;
            border-radius: 4px;
            padding: 3px 5px;
            cursor: pointer
        }

        .dbm {
            color: #8b94a7
        }

        .scanmsg {
            color: #8b94a7;
            padding: 8px 0
        }

        /* строка кнопок: «Подключиться» слева, «Забыть сети» справа */
        .btnrow {
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .forgetbtn {
            background: #4a2a2a;
            border-color: #6b3a3a
        }
    </style>
</head>

<body>
    <div style="display:flex;align-items:center;gap:8px">
        <h1>Wi-Fi</h1>
        <!-- «Назад» вверху справа, на панель -->
        <a href="#panel" style="margin-left:auto"><button type="button">&#8592; Назад</button></a>
    </div>
    <form method="POST" action="/save">
        <label>SSID сети</label><input name="ssid" id="ssid" maxlength="32" autocapitalize="off" autocorrect="off"
            spellcheck="false" required>
        <label>Пароль (для открытой сети оставьте пустым)</label><input name="pass" type="text" class="pwmask" autocomplete="off" maxlength="64"
            autocapitalize="off" autocorrect="off" spellcheck="false">
        <!-- «Подключиться» и «Забыть сети» на одной строке:
         * слева действие, справа — разрушительное -->
        <div class="btnrow">
            <button type="submit">Подключиться</button>
            <button type="button" class="forgetbtn" onclick="forgetWifi()"
                title="Стереть сохранённые подключения и перезапустить шлюз в режиме точки доступа">Забыть сети</button>
        </div>
    </form>
    <h3>Найденные сети</h3>
    <div id="nets" class="nets">сканирование…</div>
    <script src="/wifi.js"></script>
</body>

</html>
