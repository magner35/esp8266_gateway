<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>SKE-02 Gateway - WiFi</title>
    <style>
        body {
            font: 13px/1.45 system-ui, sans-serif;
            background: #000000;
            color: #d8dee9;
            max-width: 520px;
            margin: auto;
            padding: 0 12px
        }

        h1 {
            font-size: 18px
        }

        label {
            display: block;
            margin: 12px 0 4px;
            color: #8b94a7
        }

        input {
            width: 100%;
            box-sizing: border-box;
            background: #0e1116;
            color: #d8dee9;
            border: 1px solid #39414f;
            border-radius: 4px;
            padding: 8px
        }

        button {
            margin-top: 14px;
            background: #21366c;
            color: #fff;
            border: 0;
            border-radius: 4px;
            padding: 9px 9px;
            cursor: pointer;
            font-size: 12px
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 6px
        }

        td {
            padding: 6px 8px;
            border-top: 1px solid #2a3140
        }

        .pick {
            background: #233047;
            color: #d8dee9;
            border: 1px solid #39414f;
            border-radius: 6px;
            padding: 3px 10px;
            cursor: pointer
        }

        .dbm {
            color: #8b94a7
        }
        .scanmsg { color: #8b94a7; padding: 8px 0 }
        .forget { margin-top: 14px; display: flex; gap: 8px; align-items: baseline;
              color: #8b94a7; font-size: 13px }
    .forget button { background: #4a2a2a; border-color: #6b3a3a }
    </style>
</head>

<body>
    <div style="display:flex;align-items:center;gap:8px">
      <h1>SKE-02 Wi-Fi шлюз</h1>
      <!-- «Назад» вверху справа, на панель -->
      <a href="#panel" style="margin-left:auto"><button type="button">&#8592; Назад</button></a>
    </div>
    <form method="POST" action="/save">
        <label>SSID сети</label><input name="ssid" id="ssid" maxlength="32" autocapitalize="off" autocorrect="off"
            spellcheck="false" required>
        <label>Пароль (для открытой сети оставьте пустым)</label><input name="pass" type="password" maxlength="64"
            autocapitalize="off" autocorrect="off">
        <button type="submit">Подключиться</button>
    </form>
    <div class="forget">
        <button type="button" onclick="forgetWifi()">Забыть все сети</button>
        <span>— стереть сохранённые подключения и перезапустить шлюз
        в режиме точки доступа</span>
    </div>
    <h3>Найденные сети</h3>
    <div id="nets" class="nets">сканирование…</div>
    <script src="/wifi.js"></script>
</body>

</html>
