<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>SKE-02 Gateway - WiFi</title>
    <style>
        body {
            font: 13px/1.45 system-ui, sans-serif;
            background: #000000;
            color: #d8dee9;
            max-width: 520px;
            margin: auto;
            padding: 0 12px
        }

        h1 {
            font-size: 18px
        }

        label {
            display: block;
            margin: 12px 0 4px;
            color: #8b94a7
        }

        input {
            width: 100%;
            box-sizing: border-box;
            background: #0e1116;
            color: #d8dee9;
            border: 1px solid #39414f;
            border-radius: 4px;
            padding: 8px
        }

        button {
            margin-top: 14px;
            background: #2a5bdb;
            color: #fff;
            border: 0;
            border-radius: 4px;
            padding: 9px 9px;
            cursor: pointer;
            font-size: 12px
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 6px
        }

        td {
            padding: 6px 8px;
            border-top: 1px solid #2a3140
        }

        .pick {
            background: #233047;
            color: #d8dee9;
            border: 1px solid #39414f;
            border-radius: 6px;
            padding: 3px 10px;
            cursor: pointer
        }

        .dbm {
            color: #8b94a7
        }
    </style>
</head>

<body>
    <h1>Настройка Wi-Fi шлюза SKE-02</h1>
    <form method="POST" action="/save">
        <label>SSID сети</label><input name="ssid" id="ssid" maxlength="32" autocapitalize="off" autocorrect="off"
            spellcheck="false" required>
        <label>Пароль (для открытой сети оставьте пустым)</label><input name="pass" type="password" maxlength="64"
            autocapitalize="off" autocorrect="off">
        <button type="submit">Подключиться</button>
    </form>
    <h3>Найденные сети</h3>
    <div id="nets">сканирование…</div>
    <script>
        let NETS = [];
        const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        async function load(restart) {
            if (restart) await fetch('/scan?restart=1');
            const r = await (await fetch('/scan')).json();
            if (r.running) { setTimeout(() => load(0), 1500); return }
            NETS = r.nets;
            let h = '<table>';
            NETS.forEach((n, i) => {
                h += '<tr><td>' + esc(n.s) + '</td><td class="dbm">' + n.r + ' dBm</td><td>' +
                    (n.e ? '🔒' : '') + '</td><td><button class="pick" onclick="pick(' + i + ')">выбрать</button></td></tr>';
            });
            document.getElementById('nets').innerHTML = h + '</table>';
        }
        function pick(i) { document.getElementById('ssid').value = NETS[i].s }
        load(1);
    </script>
</body>

</html>
