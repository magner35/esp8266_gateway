<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        body {
            font: 13px/1.45 system-ui, sans-serif;
            background: #000000;
            color: #d8dee9;
            margin: 0;
            padding: 4px
        }

        header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px
        }

        h1 {
            font-size: 18px;
            margin: 0 8px 0 0
        }

        h2 {
            font-size: 15px;
            margin: 16px 0 6px
        }

        button {
            background: #21366c;
            color: #fff;
            border: 0;
            border-radius: 4px;
            /* единый размер: как все кнопки интерфейса */
            padding: 3px 5px;
            cursor: pointer;
            font-size: 13px
        }

        button.warn {
            background: #4a2a2a
        }

        button:disabled {
            opacity: .4;
            cursor: default
        }

        input {
            box-sizing: border-box;
            background: #0e1116;
            border: 1px solid #39414f;
            border-radius: 4px;
            color: #d8dee9;
            /* единый размер контролов: 25px высота */
            padding: 2px 4px;
            font-size: 13px
        }

        label {
            display: block;
            color: #8b94a7;
            font-size: 12px;
            margin: 8px 0 3px
        }

        .row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap
        }

        /* кнопка не тянется за длинным текстом статуса */
        .row button {
            flex: 0 0 auto
        }

        .row .msg {
            min-width: 0;
            flex: 1 1 200px
        }

        .box {
            background: #14171c;
            border: 1px solid #2a3140;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 12px
        }

        .srv {
            width: 100%
        }

        .tz {
            width: 70px
        }

        .chk {
            display: flex;
            gap: 6px;
            align-items: center;
            margin: 4px 0
        }

        .chk input {
            width: auto
        }

        .st {
            font-size: 12px;
            color: #8b94a7
        }

        .st b {
            color: #d8dee9;
            font-family: ui-monospace, Consolas, monospace
        }

        .ok {
            color: #3fb950
        }

        /* заблокированное поле видно сразу: приглушено */
        input:disabled {
            opacity: .45;
            color: #8b94a7
        }

        .msg {
            min-height: 18px;
            font-size: 13px;
            color: #52e052
        }

        .msg.err {
            color: #e05252
        }

        /* полоска прогресса прошивки */
        .pbar {
            height: 6px;
            background: #0e1116;
            border: 1px solid #39414f;
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden
        }

        .pbar>div {
            height: 100%;
            width: 0;
            background: #3f5dbf;
            transition: width .5s ease-out
        }
    </style>
</head>

<body>
    <header>
        <h1>Сервис</h1>
        <a href="#panel" style="margin-left:auto"><button>&#8592; Назад</button></a>
    </header>

    <!-- перезапуск прибора: переехал с панели -->
    <div class="box">
        <h2 style="margin:0 0 6px">Перезапуск прибора</h2>
        <button class="warn" onclick="rebootDev()">Перезапуск &#8635;</button>
    </div>

    <!-- NTP: два сервера + ручной ввод; время уйдёт в прибор для DS1307 -->
    <div class="box">
        <h2 style="margin:0 0 6px">Сервер времени NTP</h2>
        <div class="row" style="flex-wrap:wrap;gap:8px">
            <label style="margin:0;white-space:nowrap;color:#8b94a7;font-size:12px">Часовой пояс UTC</label>
            <input class="tz" id="ntpTz" type="number" min="-12" max="14" step="1">
            <label class="chk" style="margin:0" title="Определить часовой пояс по публичному IP шлюза">
                <input type="checkbox" id="ntpAuto" onchange="ntpAutoChk()">Авто</label>
        </div>
        <label>Сервер 1</label>
        <input class="srv" id="ntpS1" maxlength="31" autocapitalize="off" spellcheck="false">
        <label>Сервер 2</label>
        <input class="srv" id="ntpS2" maxlength="31" autocapitalize="off" spellcheck="false">
        <div class="row" style="margin-top:10px">
            <button onclick="ntpSave()" title="Сохранить настройки и отправить время в прибор">Сохранить</button>
            <label class="chk" style="margin:0" title="Синхронизировать время и корректировать таймер прибора"><input
                    type="checkbox" id="ntpOn"> Синхронизировать время</label>
            <span class="msg" id="ntpMsg"></span>
        </div>
    </div>

    <!-- OTA прошивки самого шлюза -->
    <div class="box">
        <h2 style="margin:0 0 6px">Обновление ПО шлюза</h2>
        <input class="srv" id="otaFile" type="file" accept=".skpak"
               title="Пакет прошивки шлюза (.skpak): tools/ota_pack.py pack firmware.bin esp out.skpak"
               onchange="otaUploadAuto(this)">
        <div class="row" style="margin-top:10px">
            <button id="otaBtn" class="warn" onclick="otaFlash(this)" disabled>Прошить шлюз</button>
            <span class="msg" id="otaMsg"></span>
        </div>
    </div>

    <!-- прошивка прибора: файл, запуск и прогресс - в одном блоке -->
    <div class="box">
        <h2 style="margin:0 0 6px">Обновление ПО прибора</h2>
        <input class="srv" id="avrFile" type="file" accept=".skpak" title="Пакет прошивки прибора (.skpak): tools/ota_pack.py pack image.hex avr out.skpak" onchange="avrUploadAuto(this)">
        <div class="row" style="margin-top:6px">
            <label style="font-size:12px;opacity:.7">временно, без пакета:</label>
            <input class="srv" id="avrHexFile" type="file" accept=".hex"
                   style="font-size:12px" onchange="avrUploadHex(this)">
        </div>
        <div class="row" style="margin-top:10px">
            <button class="warn" id="avrBtn" onclick="avrFlash(this)" disabled>Обновить</button>
            <span class="msg" id="avrMsg"></span>
        </div>
        <div class="pbar">
            <div id="avrPb"></div>
        </div>
    </div>

    <script src="/service.js"></script>
</body>

</html>
