<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKE-02</title>
<style>
body{background:#000;color:#d8dee9;font:13px/1.45 system-ui,sans-serif;margin:0;padding:4px}
html{-moz-text-size-adjust:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:root{color-scheme:dark}
.sec{display:none!important}
.sec.on{display:block!important}
/* --- index.html --- */
#sec-main #apbanner {
      display: block;
      margin: 8px 14px 0;
      padding: 10px 12px;
      background: #3a3020;
      color: #e8c46a;
      border: 1px solid #6b5b2a;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
    }#sec-main {
      font: 13px/1.45 system-ui, sans-serif;
      background: #000000;
      color: #ffffff;
      margin: 0;
      padding: 4px
    }#sec-main header {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
      margin-bottom: 5px
    }#sec-main .gear {
      margin-left: auto;
      font-size: 22px;
      line-height: 1;
      color: #d8dee9;
      text-decoration: none;
      padding: 2px 3px;
      border-radius: 4px
    }#sec-main .gear:hover {
      background: #2a3140
    }#sec-main .gear.ok {
      color: #d8dee9;
      font-size: 18px
    }#sec-main h1 {
      font-size: 18px;
      margin: 0 4px 0 0
    }#sec-main .tag {
      background: #2a3140;
      border-radius: 4px;
      padding: 2px 4px;
      font-size: 12px;
      white-space: nowrap
    }#sec-main .ok {
      background: #1d5c2f
    }#sec-main .bad {
      background: #6c2431
    }#sec-main button {
      background: #19284d;
      color: #fff;
      border: 0;
      border-radius: 4px;
      padding: 4px 4px;
      cursor: pointer;
      font-size: 12px
    }#sec-main button.warn {
      background: #7d3127
    }#sec-main #debug {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin: 0 0 4px 0;
      padding: 4px 4px;
      border: 1px dashed #39414f;
      border-radius: 4px;
      color: #8b94a7;
      font-size: 12px
    }#sec-main #debug .tag {
      background: transparent;
      border: 1px solid #2a3140;
      padding: 1px 3px
    }#sec-main #debug button {
      font-size: 12px;
      padding: 4px 4px
    }#sec-main #values {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
      gap: 6px;
      margin: 0 0 10px 0
    }@media (max-width: 640px),
    (pointer: coarse) and (hover: none){#sec-main #values {
        grid-template-columns: repeat(4, minmax(0, 1fr))
      }#sec-main #values .vcard, #sec-main #values .vcard.winp {
        grid-column: auto / span 2
      }#sec-main #values .vcard.wbit, #sec-main #values .vcard.wbtn {
        grid-column: auto / span 1
      }#sec-main #values .vcard.wbar, #sec-main #values .vcard.chart {
        grid-column: 1 / -1
      }
    }#sec-main .vcard {
      grid-column: span 2
    }#sec-main .vcard.wbar {
      grid-column: span 4
    }#sec-main .vcard {
      background: #1b202a;
      border: 2px solid #2a3140;
      border-radius: 4px;
      padding: 2px 4px;
      height: 50px;
      box-sizing: border-box;
      overflow: hidden
    }#sec-main .vname {
      color: #a8bfc5;
      font-size: 12px
    }#sec-main .vval {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 20px;
      white-space: nowrap
    }#sec-main .vcard.wide {
      grid-column: span 4
    }#sec-main .vcard.chart {
      grid-column: 1/-1
    }#sec-main .vcard.chart {
      height: auto;
      overflow: visible;
      grid-column: 1/-1
    }#sec-main .vcard.chart canvas {
      width: 100%;
      display: block
    }#sec-main .vcard.chart.off {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 8px 12px
    }#sec-main .vcard.chart.off .vname { margin: 0 }#sec-main .chartsoff {
      color: #8b94a7;
      font-size: 12px
    }#sec-main #btnEdit.act {
      background: #1d5c2f
    }#sec-main.edit .vcard {
      outline: 2px dashed #6a5a1f;
      cursor: grab;
      touch-action: none;
      -webkit-touch-callout: none
    }#sec-main.edit .vcard.dragging {
      opacity: .35;
      cursor: grabbing
    }#sec-main.edit #values {
      user-select: none
    }#sec-main .hbar {
      position: relative;
      background: #0e1116;
      border: 1px solid #39414f;
      border-radius: 2px;
      height: 20px;
      margin-top: 6px;
      overflow: hidden
    }#sec-main .hfill {
      height: 100%;
      width: 0;
      transition: width .20s ease-out;
      background: repeating-linear-gradient(90deg, #3f5dbf 0 10px, transparent 10px 12px)
    }#sec-main .vcard.wbar {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 3px
    }#sec-main .vcard.wbar .hbar {
      height: 20px;
      margin-top: 0
    }#sec-main .bpct {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 15px;
      line-height: 1;
      font-family: ui-monospace, Consolas, monospace;
      text-shadow: 0 0 3px #000, 0 0 3px #000
    }#sec-main .vrow {
      display: flex;
      justify-content: flex-end;
      align-items: baseline;
      gap: 4px
    }#sec-main .vunit {
      color: #8b94a7;
      font-size: 11px;
      white-space: nowrap
    }#sec-main .bsub {
      float: right;
      color: #a8bfc5;
      font-size: 11px;
      white-space: nowrap
    }#sec-main .utop {
      float: right;
      color: #a8bfc5;
      font-size: 11px;
      white-space: nowrap
    }#sec-main .vcard.wbit {
      grid-column: span 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 2px;
      padding: 3px 4px
    }#sec-main .vcard.wbit .vname {
      white-space: normal;
      font-size: 12px;
      line-height: 1.15;
      color: #a8bfc5;
      overflow: hidden
    }#sec-main .bitlamp {
      height: 20px;
      border: 1px solid #39414f;
      border-radius: 6px;
      background: #0e1116;
      transition: background .15s
    }#sec-main .bitlamp.on {
      box-shadow: 0 0 6px 0 currentColor
    }#sec-main .vcard.wbtn {
      grid-column: span 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      padding: 3px 4px;
      height: 50px;
      box-sizing: border-box;
      align-items: center;
      text-align: center;
      cursor: pointer;
      user-select: none;
      font-weight: 650;
      font-size: 18px;
      color: #E0E0E0;
    }#sec-main .vcard.wbtn:active {
      filter: brightness(1.3)
    }#sec-main .vcard.winp {
      grid-column: span 4;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 3px;
      box-sizing: border-box;
      height: 50px;
      justify-content: space-between
    }#sec-main .vcard.winp input {
      background: #0e1116;
      color: #d8dee9;
      border: 1px solid #39414f;
      border-radius: 4px;
      padding: 0px 3px;
      font: 17px ui-monospace, Consolas, monospace;
      text-align: right;
      width: 100%;
      box-sizing: border-box
    }
/* --- widgets.html --- */
#sec-widgets {
      font: 13px/1.45 system-ui, sans-serif;
      background: #000000;       
      color: #d8dee9;
      margin: 0;
      padding: 4px
    }#sec-widgets header {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px
    }#sec-widgets h1 {
      font-size: 18px;
      margin: 0 8px 0 0
    }#sec-widgets header .back {
      margin-left: auto
    }#sec-widgets button {
      background: #21366c;
      color: #fff;
      border: 0;
      border-radius: 4px;
      padding: 5px 5px;
      cursor: pointer;
      font-size: 12px
    }#sec-widgets button.warn { background: #a23b2e }#sec-widgets { color-scheme: dark }#sec-widgets .flash {
      color: #7aa2f7;
      font-size: 12px
    }#sec-widgets #wpanel {
      display: flex;
      flex-direction: column;
      gap: 6px
    }#sec-widgets .wrow {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: #141821;
      border: 1px solid #232a38;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 13px
    }#sec-widgets .r1, #sec-widgets .r2 {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center
    }#sec-widgets .r1 span {
      flex: 1              
    }#sec-widgets button.sq {
      width: 26px;
      height: 26px;
      padding: 0;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center
    }#sec-widgets .r1 .autolbl {
      flex: 0 0 auto;
      white-space: nowrap
    }#sec-widgets .wsec {
      color: #8b94a7;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-top: 6px
    }#sec-widgets select, #sec-widgets input[type=number] {
      background: #0e1116;
      color: #d8dee9;
      border: 1px solid #39414f;
      border-radius: 4px;
      padding: 2px 4px;
      font-size: 13px
    }#sec-widgets select:disabled {
      color: #565f6e;
      background: #141821
    }#sec-widgets .r2 select, #sec-widgets .r2 input {
      min-width: 0;
      max-width: 26vw;            
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 0 1 auto              
    }#sec-widgets .r2 {
      flex-wrap: nowrap           
    }#sec-widgets .r2 label {
      white-space: nowrap;
      flex: 0 0 auto
    }
/* --- panel.html --- */
#sec-panel {
      font: 14px/1.45 system-ui, sans-serif;
      background: #000000;       
      color: #d8dee9;
      margin: 0;
      padding: 4px
    }#sec-panel header {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px
    }#sec-panel h1 {
      font-size: 18px;
      margin: 0 8px 0 0
    }#sec-panel button {
      background: #21366c;       
      color: #fff;
      border: 0;
      border-radius: 4px;
      padding: 5px 5px;
      cursor: pointer;
      font-size: 12px
    }#sec-panel button.warn { background: #a23b2e }#sec-panel button.ok { background: #1d5c2f }#sec-panel input {
      background: #0e1116;       
      color: #d8dee9;
      border: 1px solid #39414f;
      border-radius: 4px;
      padding: 4px 8px;
      box-sizing: border-box
    }#sec-panel { color-scheme: dark }#sec-panel .tag {
      background: #2a3140;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 12px;
      white-space: nowrap
    }#sec-panel h2 {
      font-size: 13px;
      color: #8b94a7;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin: 16px 0 6px
    }#sec-panel .tiles {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px
    }#sec-panel .tile {
      background: #1b202a;       
      border: 1px solid #2a3140;
      border-radius: 4px;
      padding: 14px 10px;
      text-align: center;
      cursor: pointer;
      color: #d8dee9;
      text-decoration: none;
      font-size: 14px
    }#sec-panel .tile:hover { background: #232a38 }#sec-panel .tile .ic { font-size: 20px; display: block; margin-bottom: 4px }#sec-panel .prow {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      background: #1b202a;
      border: 1px solid #232a38;
      border-radius: 4px;
      padding: 4px 8px;
      margin-bottom: 6px;
      font-size: 13px
    }#sec-panel .prow .pname { flex: 1 }#sec-panel #newName { width: 160px }#sec-panel #debug {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin: 0 0 8px 0;
      padding: 4px 8px;
      border: 1px dashed #39414f;
      border-radius: 4px;
      color: #8b94a7;
      font-size: 12px
    }#sec-panel #debug .tag {
      background: transparent;
      border: 1px solid #2a3140;
      padding: 1px 6px
    }
/* --- settings.html --- */
#sec-settings h1 {
      font-size: 18px;
      margin: 0 8px 0 0
    }#sec-settings .tag {
      background: #2a3140;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 12px;
      white-space: nowrap
    }#sec-settings .ok {
      background: #1d5c2f
    }#sec-settings .bad {
      background: #6c2431
    }#sec-settings button {
      background: #21366c;
      color: #fff;
      border: 0;
      border-radius: 4px;
      padding: 5px 5px;
      cursor: pointer;
      font-size: 12px
    }#sec-settings input, #sec-settings select {
      background: #0e1116;
      color: #d8dee9;
      border: 1px solid #39414f;
      border-radius: 4px;
      padding: 4px 4px;
      box-sizing: border-box
    }#sec-settings #filter {
      width: 200px
    }#sec-settings #nav {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px
    }#sec-settings #nav button {
      background: #2a3140;
      font-size: 12px;
      padding: 8px 8px
    }#sec-settings #nav button.act {
      background: #21366c;
    }#sec-settings .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 2px;                    
      border-bottom: 2px solid #2a3140;

    }#sec-settings .tabs button {
      background: transparent;
      color: #8b94a7;
      border: 0;

    }#sec-settings .tabs button.act {
      color: #d8dee9;

    }#sec-settings .subtabs {
      display: flex;
      flex-wrap: wrap;
      gap: 2px;

    }#sec-settings .subtabs button {
      background: #232a38;

      border: 0;

      padding: 2px 4px;

    }#sec-settings .subtabs button.act {
      background: #1d5c2f;

    }#sec-settings table {
      width: 100%;
      border-collapse: collapse
    }#sec-settings td, #sec-settings th {
      padding: 2px 4px;             
      border-top: 1px solid #2a3140;

    }#sec-settings th {
      color: #8b94a7;

      font-size: 12px
    }#sec-settings .val {
      font-family: ui-monospace, Consolas, monospace;
      white-space: nowrap
    }#sec-settings .stale {
      color: #8b94a7
    }#sec-settings .ctl {
      text-align: right;

    }#sec-settings .where {
      color: #8b94a7;

    }#sec-settings .set {
      display: flex;
      gap: 6px;

      justify-content: flex-end
    }#sec-settings .set input[type=number], #sec-settings .set input[type=text] {
      width: 80px;

    }#sec-settings .set input.fnum {
      width: 80px
    }#sec-settings .set select {
      max-width: 100px
    }#sec-settings .t2 {

    }#sec-settings .flash {

/* --- wifi.html --- */
#sec-wifi {
            font: 13px/1.45 system-ui, sans-serif;
            background: #000000;
            color: #d8dee9;
            max-width: 520px;
            margin: auto;
            padding: 0 12px
        }#sec-wifi h1 {
            font-size: 18px
        }#sec-wifi label {
            display: block;
            margin: 12px 0 4px;
            color: #8b94a7
        }#sec-wifi input {
            width: 100%;
            box-sizing: border-box;
            background: #0e1116;
            color: #d8dee9;
            border: 1px solid #39414f;
            border-radius: 4px;
            padding: 8px
        }#sec-wifi button {
            margin-top: 14px;
            background: #21366c;
            color: #fff;
            border: 0;
            border-radius: 4px;
            padding: 9px 9px;
            cursor: pointer;
            font-size: 12px
        }#sec-wifi table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 6px
        }#sec-wifi td {
            padding: 6px 8px;
            border-top: 1px solid #2a3140
        }#sec-wifi .pick {
            background: #233047;
            color: #d8dee9;
            border: 1px solid #39414f;
            border-radius: 6px;
            padding: 3px 10px;
            cursor: pointer
        }#sec-wifi .dbm {
            color: #8b94a7
        }#sec-wifi .scanmsg { color: #8b94a7; padding: 8px 0 }#sec-wifi .forget { margin-top: 14px; display: flex; gap: 8px; align-items: baseline;

<body>
<section class="sec" id="sec-main">
<header>
    <h1>SKE-02 Gateway</h1>
    <span id="link" class="tag">…</span>
    <a href="#" class="gear" id="gear" onclick="gearClick();return false" title="Панель">&#9881;</a>
  </header>
  <div id="values"></div>
  <button id="btnEdit" onclick="toggleEdit()" hidden>&#9998; Раскладка</button>
</section>
<section class="sec" id="sec-widgets">
<header>
    <h1>SKE-02 Виджеты</h1>
    <a class="back" href="#panel"><button>&#8592; Назад</button></a>
  </header>
  <div id="wpanel">
    <div id="wlist"></div>
  </div>
</section>
<section class="sec" id="sec-panel">
<header>
    <h1>SKE-02 Панель</h1>
    <a href="#main" style="margin-left:auto"><button>&#8592; Назад</button></a>
  </header>
  <div class="tiles">
    <a class="tile" href="#main" onclick="setTimeout(()=>{ if(!editing) toggleEdit() },80)"><span class="ic">&#9998;</span>Раскладка</a>
    <a class="tile" href="#widgets"><span class="ic">&#9633;</span>Виджеты</a>
    <a class="tile" href="#settings"><span class="ic">&#9881;</span>Прибор</a>
    <a class="tile" href="#wifi"><span class="ic">&#128246;</span>Wi-Fi</a>
    <a class="tile" href="#" onclick="rebootDev();return false"><span class="ic">&#8635;</span>Перезапуск</a>
  </div>
  <h2>Профили виджетов</h2>
  <div id="profiles"></div>
  <div class="prow">
    <input id="newName" placeholder="имя профиля" onkeydown="if(event.key==='Enter')this.blur()">
    <button onclick="profCreate()">Сохранить текущий набор</button>
  </div>
  <h2>Отладочная панель</h2>
  <div id="debug">
    <button onclick="rescan()">Пересканировать</button>
    <span id="fw" class="tag"></span>
    <span class="tag" id="ip"></span><span class="tag" id="rss"></span>
    <span class="tag" id="upt"></span><span class="tag" id="heap"></span>
  </div>
</section>
<section class="sec" id="sec-settings">
<header>
    <h1>SKE-02 Прибор</h1>
    <a href="#panel" style="margin-left:auto"><button>&#8592; Назад</button></a>
  </header>
  <div id="nav"></div>
  <div id="tabs"></div>
  <div id="subtabs"></div>
  <div id="actions">
    <input id="secPw" type="password" inputmode="numeric" maxlength="6" placeholder="пароль меню" oninput="pwInput()">
    <button id="btnApply" onclick="applyAll()">Применить</button>
    <button id="btnRefresh" onclick="refreshAll()">Обновить</button>
    <span id="applyMsg" class="flash"></span>
  </div>
  <div id="bar">
    <input id="filter" placeholder="фильтр по имени или id" oninput="applyFilter()">
  </div>
  <div id="sections">
    <p>Опрос прибора…</p>
  </div>
</section>
<section class="sec" id="sec-wifi">
<div style="display:flex;align-items:center;gap:8px">
      <h1>SKE-02 Wi-Fi шлюз</h1>
      <a href="#panel" style="margin-left:auto"><button type="button">&#8592; Назад</button></a>
    </div>
    <form method="POST" action="/save">
        <label>SSID сети</label><input name="ssid" id="ssid" maxlength="32" autocapitalize="off" autocorrect="off"
            spellcheck="false" required>
        <label>Пароль (для открытой сети оставьте пустым)</label><input name="pass" type="password" maxlength="64"
            autocapitalize="off" autocorrect="off">
        <button type="submit">Подключиться</button>
    </form>
    <div class="forget">
        <button type="button" onclick="forgetWifi()">Забыть все сети</button>
        <span>— стереть сохранённые подключения и перезапустить шлюз
        в режиме точки доступа</span>
    </div>

    const CHSRC = {

    function chUnit(s) {
      const un = CHSRC[s].un;
      if (un === 'hz') return 'Гц';
      if (un === 'kf') return MULU ? 'имп/' + MULU : '';
      if (un === 'price') return MULU ? MULU + '/имп' : '';

      if (!u) return '';

    }
    const CHART_AUTO_ONLY = ['kf', 'price', 'freq', 'pulses'];
    const CHPER = {
      60: '1 мин', 300: '5 мин', 600: '10 мин', 1800: '30 мин',
      3600: '60 мин', 86400: '24 ч'
    };
    const CHCOL = [
      { n: 'красный', c: '#e05252' },
      { n: 'оранжевый', c: '#e08a3c' },
      { n: 'жёлтый', c: '#e3d041' },
      { n: 'зелёный', c: '#3fbf5f' },
      { n: 'голубой', c: '#4cc7e0' },

    const chartLive = {};               
    const CHARTS_ON = true;
    const CHSCALE = {};                 
    function niceStep(x) {
      if (!(x > 0) || !isFinite(x)) return 1;
      const p = Math.pow(10, Math.floor(Math.log10(x)));
      const d = x / p;
      return (d >= 5 ? 5 : d >= 2 ? 2 : 1) * p;
    }
    function chartCol(w) {
      const e = CHCOL.find(x => x.c === w.col);

    }
    function srcName(w) { return w.src; }
    async function chartBackfill(src) {
      try {
        let buf = chartLive[src];
        if (!buf) buf = chartLive[src] = { vals: [], ts: [], srv: 0 };
        const d = await (await fetch('/api/chart?since=' + (buf.srv || 0))).json();
        if (!d.t || !d.t.length) return;
        const off = Date.now() - d.now;
        for (let i = 0; i < d.t.length; i++) {

          if (buf.ts.length && t <= buf.ts[buf.ts.length - 1]) continue;
          buf.vals.push(d.v[i]);
          buf.ts.push(t);

        }
      } catch (e) { }
    }
    async function chartFeed(d) {
      if (!CHARTS_ON) return;
      if (!widgets) return;
      const srcs = new Set();
      for (const w of widgets)
        if (w.t === 'chart' && w.on && CHSRC[w.src] &&
            d[CHSRC[w.src].src] !== undefined)
          srcs.add(w.src);
      for (const src of srcs) {
        const buf = chartLive[src];
        const gap = buf && buf.ts.length ?

        if (gap > CHART_HARD_RESET_MS)

        if (!isFinite(gap) || gap > CHART_GAP_MS)
          await chartBackfill(src);

    }
    const CHART_STALE_MS = 2000;    
    const CHART_HARD_RESET_MS = 60000; 
    const CHART_GAP_MS = 3000;      
    const CHART_EDGE_MS = 1500;     
    let sAtt = 0, sFail = 'вызовов не было';
    let sLastResp = 'ответов не было';   
    function chartAppend(src, value, srvT) {
      if (!CHARTS_ON) return;
      sAtt++;
      if (!isFinite(value)) { sFail = 'не число: ' + value; return; }
      let buf = chartLive[src];
      const t = srvT || Date.now();
      if (buf && buf.ts.length &&
          t - buf.ts[buf.ts.length - 1] > CHART_HARD_RESET_MS)
        buf = chartLive[src] = { vals: [], ts: [] };
      if (!buf) buf = chartLive[src] = { vals: [], ts: [] };
      if (buf.ts.length && t <= buf.ts[buf.ts.length - 1]) {
        sFail = 'не монотонно: ' + Math.round(t - buf.ts[buf.ts.length - 1]) + 'мс';
        return;

      sFail = 'принято';
      buf.vals.push(value);
      buf.ts.push(t);
      if (buf.vals.length > 3000) {
        const v2 = [], t2 = [];
        for (let i = 0; i < buf.vals.length; i += 2) {
          v2.push(buf.vals[i]);
          t2.push(buf.ts[i]);
        }
        buf.vals = v2;
        buf.ts = t2;
      }
    }
    let chartHiddenAt = 0;
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { chartHiddenAt = Date.now(); return; }
      if (chartHiddenAt && Date.now() - chartHiddenAt > CHART_STALE_MS)

    function chartDrawAll() {

    }
    function chartHeight() {

    function chartDraw(w) {

      const chartEmpty = (msg) => {

        for (const p of pts) srcv.push(p.v);
        for (let i = 1; i < pts.length - 1; i++) {

      const col = chartCol(w);

      const cw = cv.offsetWidth, ch = chartHeight();
      if (cv.width !== cw * dpr || cv.height !== ch * dpr) { cv.width = cw * dpr; cv.height = ch * dpr }
      const g = cv.getContext('2d');
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, cw, ch);
      g.strokeStyle = '#2a3140'; g.lineWidth = 1;
      for (let k = 1; k < 4; k++) { const y = ch * k / 4; g.beginPath(); g.moveTo(0, y); g.lineTo(cw, y); g.stroke() }
      let lo, hi, minV = Infinity, maxV = -Infinity;
      for (const p of pts) { if (p.v < minV) minV = p.v; if (p.v > maxV) maxV = p.v }
      if (w.auto === false && !CHART_AUTO_ONLY.includes(w.src)) {
        if (CHSRC[w.src].un === 'rate') {
          hi = SP.rate;

        let vmin = Infinity, vmax = -Infinity, has = false, qEnd = idx;
        for (let q = idx; q < n && pts[q].t < tt1; q++) {
          const v = pts[q].v;
          if (v < vmin) vmin = v;
          if (v > vmax) vmax = v;
          has = true;
          qEnd = q;
        }
        if (!has) continue;
        if (has && lastDataT && qEnd >= 0 &&
            pts[idx].t - lastDataT > CHART_GAP_MS) {
          top.push(NaN, NaN);
          bot.push(NaN, NaN);
        }
        if (qEnd >= 0)
          lastDataT = pts[qEnd].t;
        top.push(px, Y(vmax));
        bot.push(px, Y(vmin));
      }
      let firstX = null, lastX = null;
      for (let i = 0; i < top.length; i += 2)
        if (isFinite(top[i])) {
          if (firstX === null) firstX = top[i];
          lastX = top[i];
        }
      if (firstX !== null) {
        g.beginPath();
        let pen = false;
        for (let i = 0; i < top.length; i += 2) {
          if (!isFinite(top[i])) { pen = false; continue; }
          if (pen) g.lineTo(top[i], top[i + 1]);
          else { g.moveTo(top[i], top[i + 1]); pen = true; }
        }
        pen = false;
        for (let i = bot.length - 2; i >= 0; i -= 2) {
          if (!isFinite(bot[i])) { pen = false; continue; }
          if (pen) g.lineTo(bot[i], bot[i + 1]);
          else { g.moveTo(bot[i], bot[i + 1]); pen = true; }

        g.strokeStyle = col; g.lineWidth = 1; g.stroke();

          if (pen) g.lineTo(top[i], top[i + 1]);
          else { g.moveTo(top[i], top[i + 1]); pen = true; }

function routeTo(id) {
  if (location.hash !== '#' + id) location.hash = id;
  else showSec(id);
}
function showSec(id) {
  let found = false;
  document.querySelectorAll('.sec').forEach(s => {
    const on = s.id === 'sec-' + id;
    if (on) found = true;
    s.classList.toggle('on', on);
  });
  if (!found) showSec('main');

}
function spaRoute() {
  const h = location.hash.replace('#', '');
  if (h) return showSec(h);

  const map = { '/settings': 'settings', '/panel': 'panel',
                '/widgets': 'widgets', '/wifi': 'wifi' };
  showSec(map[p] || 'main');
}
