; ESP8266 gateway for the SKE-02 flow meter - ESP8266_RTOS_SDK port (pure C).
; FreeRTOS tasks: meter (UART console client), http (tcp/80), dns (udp/53,
; captive portal), modbus (tcp/502).
;
; The Arduino (C++) version of this project lives in the original
; esp8266_gateway repository; this fork is the RTOS-SDK rewrite.
;
; Build / upload / monitor:
;   pio run -e esp8266_modern_rtos
;   pio run -e esp8266_modern_rtos -t upload
;   pio device monitor -e esp8266_modern_rtos
;
; Platform: freedib's espressif8266 fork driving the REAL ESP8266_RTOS_SDK
; v3.4 (IDF-style API: esp_wifi, nvs, lwIP sockets, app_main). Its manifest
; requires platformio/tool-genbin-esp8266 which is NOT published in the
; PlatformIO registry (only the NonOS builder actually uses genbin) - the
; platform_packages override below points it at freedib's git copy.

[env:esp8266_modern_rtos]
platform = https://github.com/freedib/platform-espressif8266.git
framework = esp8266-rtos-sdk
platform_packages =
    framework-esp8266-rtos-sdk @ https://github.com/freedib/framework-esp8266-rtos-sdk.git@3.4
    toolchain-xtensa @ https://github.com/freedib/toolchain-xtensa-windows-amd64-8.4.0.git@8.4.0
    tool-genbin-esp8266 @ https://github.com/freedib/tool-genbin-esp8266.git

board = esp12e
upload_speed = 921600
monitor_speed = 115200
