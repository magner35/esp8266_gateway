; ESP8266 gateway for the SKE-02 flow meter:
;   - service console client over UART (binary protocol, 115200 8N1)
;   - WiFi setup captive portal + web UI with the device parameters
;   - Modbus TCP slave exposing the parameters to a SCADA master
;
; Build / upload / monitor from this project directory:
;   pio run
;   pio run -t upload
;   pio device monitor
;
; Two environments:
;   nodemcuv2_usbdbg - bench bring-up: debug log on UART0 = the USB port,
;                      the meter UART link is DISABLED.
;   nodemcuv2        - production: meter console on UART0 (GPIO1/3),
;                      debug log on UART1 (GPIO2, TX only).

[platformio]
default_envs = nodemcuv2_usbdbg ; switch to nodemcuv2 when the meter is attached

[env]
platform = espressif8266
framework = arduino
upload_speed = 921600
monitor_speed = 115200

[env:nodemcuv2]
board = nodemcuv2 ; for a bare ESP-12E/ESP-12F module use: board = esp12e

[env:nodemcuv2_usbdbg]
board = nodemcuv2
build_flags = -DGW_DEBUG_USB
